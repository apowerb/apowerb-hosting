name: apowerb

# Three services are always there: the database, the backend, the interface.
#
# Two more are OPTIONAL, one profile each, both off unless you ask for them:
#
#   COMPOSE_PROFILES=pulse   observability -- agent traces and logs
#   COMPOSE_PROFILES=etl     orchestration -- scheduled agent runs
#   COMPOSE_PROFILES=pulse,etl               both
#
# Neither profile is only a profile: each needs ONE more line in .env to be
# reached by the backend, and the profile without that line runs a service
# nobody talks to. Both pairs are documented in .env.example, next to the
# services below.
#
# `docker compose config --services` is the answer to "what will this run",
# and it is worth asking: COMPOSE_PROFILES is read from your shell FIRST and
# from .env second, so a stale export elsewhere turns a profile on while the
# file still says off.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  apowerb:
    # Pinned, like every other deployment path in this repository. `latest` is
    # a moving tag: it promises nothing about the two images having been tested
    # together, and it makes an install unreproducible -- run the quick start
    # tomorrow and you may get a different pair. This one was proven together
    # (sign-up, sign-in, an agent created and read back, the control panel API
    # answering). Override BOTH tags in `.env` when you move, never one alone:
    # the frontend and the backend cap each other in both directions.
    image: ${APOWERB_BACKEND_IMAGE:-apowerb/apowerb}:${APOWERB_BACKEND_TAG:-0.2.12}
    pull_policy: always
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      ENCRYPT_KEY: ${ENCRYPT_KEY}
      TH2_EXTENSIONS: ${TH2_EXTENSIONS:-}
      WORKING_MODE: ${WORKING_MODE:-development}
      # Shared model. Without both of these the provider is simply not offered,
      # and every agent has to carry its own API key.
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-}
      DEFAULT_LLM_API_KEY: ${DEFAULT_LLM_API_KEY:-}
      DEFAULT_LLM_API_BASE: ${DEFAULT_LLM_API_BASE:-}
      # System mailer. Empty means no system email is sent at all.
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-}
      NOTIFICATION_INTEGRATION_OWNER: ${NOTIFICATION_INTEGRATION_OWNER:-}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      # A different variable, not a spelling of the one above: that one is
      # who receives ETL alerts, this one is who becomes an administrator.
      # Without it a fresh install has no admin at all, and the Logging
      # screen -- administrators only -- is empty for everyone.
      #
      # The e-mail alone is the whole configuration: whoever signs up with
      # that address is created ADMIN, with their own password. Proven on a
      # fresh install, 04/09/2026. The password below only creates the
      # account up front and is optional; a shipped default password is a
      # published one, so neither has a default.
      DEFAULT_SUPERADMIN_EMAIL: ${DEFAULT_SUPERADMIN_EMAIL:-}
      DEFAULT_SUPERADMIN_PASSWORD: ${DEFAULT_SUPERADMIN_PASSWORD:-}
      # Observability. ADK reads this at startup and builds a span exporter
      # when it is set; unset, it emits nothing and costs nothing. It must be
      # set TOGETHER with COMPOSE_PROFILES=pulse -- set alone, the application
      # keeps retrying an exporter that has nowhere to send. See .env.example.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-apowerb}
      # Orchestration. `mage` is the default and there is no Mage in this
      # stack, which is why the Orchestrator screen answers 503 out of the
      # box: `/api/pipelines` says "Mage is unreachable", truthfully.
      #
      # ORCHESTRATOR=th2etl is the OTHER line of the etl pair. The profile
      # without it runs an orchestrator the backend never addresses; this
      # without the profile points the backend at a service that is not there.
      # A Compose environment cannot depend on a profile, which is why this is
      # a line you set rather than something the profile sets for you.
      ORCHESTRATOR: ${ORCHESTRATOR:-mage}
      TH2ETL_BASE_URL: ${TH2ETL_BASE_URL:-http://th2etl:8000}
      # The third option, for a deployment that wants neither: set this to
      # false and the feature and its screen go away, instead of a screen that
      # is there and answers 503. Measured with the profile off:
      # `GET /api/pipelines` -> 503 "No orchestrator is configured in this
      # installation."
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      # Must equal the th2etl service's API_KEY below. Without it th2etl
      # answers 401 and scheduling stops.
      TH2ETL_API_KEY: ${TH2ETL_API_KEY:-}
    volumes:
      - apowerb-data:/app/data
    ports:
      - "${TH2AGENT_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  apowerb-ui:
    # Pinned with the backend above -- see the note there. 0.1.12 is a floor:
    # 0.1.11 still bundled an SDK calling `/api/admin/organizations`, which the
    # backend stopped serving when organisations became a commercial brick.
    image: ${APOWERB_FRONTEND_IMAGE:-apowerb/apowerb-ui}:${APOWERB_FRONTEND_TAG:-0.1.18}
    pull_policy: always
    environment:
      API_URL: http://apowerb:8000
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      # Where the Logging screen reads from. Without it the frontend falls
      # back to its own loopback, where nothing listens, and every request
      # answers 502 "Logging store unavailable" -- measured 04/09/2026.
      # Harmless when the profile is off: the screen is simply empty, as it
      # already was.
      PULSE_API_URL: http://th2pulse:4319
      # The ingest binds 0.0.0.0 and rejects a reader that presents no token.
      # Same value as the ingest's own, server-side only, never sent to the
      # browser. Unset on both sides, the ingest accepts reads and this
      # changes nothing.
      PULSE_QUERY_TOKEN: ${TH2PULSE_QUERY_TOKEN:-}
    ports:
      - "${FRONT_PORT:-3000}:3000"
    depends_on:
      - apowerb
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────────────
  # OPTIONAL — observability. Logs and agent traces. Off by default.
  #
  #   COMPOSE_PROFILES=pulse
  #   OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
  #
  # Both lines, together -- see .env.example. Nothing else in the stack
  # changes, and with the profile off these two services are not created at
  # all: `docker compose up` stays the three services it was.
  #
  # `logs` is kept beside `pulse` as a second name for this profile, because
  # that is what it was called when it shipped and an existing .env should
  # keep working. Either name turns these two on.
  #
  # What this stores today: the agent traces ADK emits natively -- tool
  # executions with their arguments and responses, LLM calls, durations,
  # each tagged with its conversation. The `/logs` side of the ingest stays
  # empty until the application adopts the th2pulse logging bridge
  # (`th2pulse.init_observability`), which this image does not call yet.
  #
  # WHAT THIS PROFILE WAS PROVEN TO DO. A span POSTed to the collector comes
  # back out of the ingest's `/spans`, and `/spans` answers 401 without the
  # query token.
  #
  # ⚠️ WHERE IT STOPS TODAY, and it is a live trap. Measured inside the
  # published images apowerb-ui 0.1.12 AND 0.1.13 (control run in the same
  # command: `dashboard` matches 164 files, so the search does look):
  #
  #     PULSE_API_URL           6 files   -- it knows WHERE the ingest is
  #     PULSE_QUERY_TOKEN       0 files   -- it never reads the token
  #     x-th2pulse-query-token  0 files   -- it never sends the header
  #
  # So the published frontend can reach the ingest and cannot authenticate to
  # it. `./scripts/generate-secrets.sh` fills TH2PULSE_QUERY_TOKEN by default,
  # which makes the ingest REQUIRE what the frontend does not send: the
  # Logging screen then stays empty on an otherwise correct install. Leaving
  # TH2PULSE_QUERY_TOKEN empty on both sides opens the ingest's reads instead
  # -- `/spans` serves recorded tool arguments and responses, so that is a
  # deliberate trade, not a default.
  #
  # (Inference, not exercised end to end: the two measurements above are, the
  # empty screen that follows from them is not.)
  # ───────────────────────────────────────────────────────────────────────────
  otel-collector:
    profiles: [pulse, logs]
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib}:${OTEL_COLLECTOR_TAG:-0.159.0}
    command: ["--config=/etc/otel/config.yaml"]
    environment:
      TH2PULSE_INGEST_TOKEN: ${TH2PULSE_INGEST_TOKEN:-}
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro
    depends_on:
      th2pulse:
        condition: service_healthy
    restart: unless-stopped

  th2pulse:
    profiles: [pulse, logs]
    # Pinned, like the other two. 0.1.4 is a FLOOR, not a preference: images
    # before it never create the schema named below, so the service
    # restart-loops on "no schema has been selected to create in". And
    # everything before 0.1.3 exits on start outright -- the published 0.1.2
    # was built without the `ingest` extra and dies on "No module named
    # fastapi".
    image: ${TH2PULSE_IMAGE:-apowerb/th2pulse}:${TH2PULSE_TAG:-0.1.4}
    pull_policy: always
    environment:
      # Its own schema in the stack's Postgres rather than a second database:
      # the tables are created there on first start.
      TH2PULSE_DB_DSN: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      TH2PULSE_DB_SCHEMA: ${TH2PULSE_DB_SCHEMA:-th2pulse}
      # Required, both of them. The image binds 0.0.0.0 -- a container's
      # loopback reaches nothing -- so the endpoints have no other protection
      # and the service refuses to start without these. `/spans` serves
      # recorded tool arguments and responses; it is not a read to leave open.
      # `./scripts/generate-secrets.sh` fills them.
      TH2PULSE_INGEST_TOKEN: ${TH2PULSE_INGEST_TOKEN:-}
      TH2PULSE_QUERY_TOKEN: ${TH2PULSE_QUERY_TOKEN:-}
    # Deliberately publishes no host port: only the collector writes to it,
    # over the internal network. Note that "internal" is the whole stack
    # network -- every container here can reach it, which is why the tokens
    # above are not decoration.
    #
    # It also connects as DB_USER, the same role the application uses. That
    # keeps the stack to one database and one set of credentials, and it
    # means this service is not a smaller blast radius than the backend --
    # only a smaller surface. Give it a role of its own if that matters to
    # your deployment.
    healthcheck:
      # No curl in the image; python is what it runs on.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:4319/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────────────
  # OPTIONAL — orchestration. Scheduled agent runs. Off by default.
  #
  #   COMPOSE_PROFILES=etl
  #   ORCHESTRATOR=th2etl
  #   TH2ETL_API_KEY=<a secret; ./scripts/generate-secrets.sh fills it>
  #
  # This is what makes the Orchestrator screen work. Without it the backend
  # defaults to ORCHESTRATOR=mage, this stack ships no Mage, and
  # `/api/pipelines` answers 503 "Mage is unreachable" -- which is the honest
  # answer, and still a broken screen for anyone self-hosting.
  #
  # Two services, not one. th2etl does NOT create the agent pipelines on
  # demand -- the backend only checks that they exist and logs "run the th2etl
  # seed to provision it" when they do not. So the seed runs here, once per
  # `up`, and it is idempotent: it skips what is already there.
  # ───────────────────────────────────────────────────────────────────────────
  th2etl:
    profiles: [etl]
    # Pinned, like everything else here. The image is apowerb/th2etl -- the
    # namespace this product ships under, alongside apowerb/th2pulse and
    # apowerb/apowerb. It carried th2farid/th2etl until 2026-09-08.
    #
    # 0.0.12 is what `latest` points at. Measured on 2026-09-08 against a
    # throwaway Postgres: answers 200 on /openapi.json, and the seed module
    # provisions blocs agents_runner, pdf_extract, pdf_agent and pipelines
    # agents, process_pdf.
    image: ${TH2ETL_IMAGE:-apowerb/th2etl}:${TH2ETL_TAG:-0.0.12}
    pull_policy: always
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DB_NAME}
      DATABASE_USER: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      # DATABASE_SCHEMA is deliberately NOT set. th2etl qualifies its tables
      # with the schema but never creates it, so naming one that does not
      # exist leaves the service up with its API dead: "Application startup
      # failed" on `schema "th2etl" does not exist`, container still there.
      # Unset, its six tables land in `public` -- all of them `etl_`-prefixed,
      # so they cannot collide with the backend's own.
      #
      # Required in practice, and deliberately NOT written `:?`. Compose
      # interpolates the whole file before it looks at profiles -- measured:
      # a `:?` here aborts `docker compose config` for everyone, profile off
      # included. So the guard stays where it can be conditional: th2etl
      # itself refuses every business route with "Authentication not
      # configured: set API_KEY" rather than serving them open.
      API_KEY: ${TH2ETL_API_KEY:-}
      # Where th2etl's ADK blocks call back into the backend.
      ADK_BASE_URL: ${ADK_BASE_URL:-http://apowerb:8000}
      ENCRYPT_KEY: ${ENCRYPT_KEY}
    # No host port on purpose: only the backend talks to it, over the internal
    # network. That network is the whole stack, which is why API_KEY above is
    # a requirement and not hardening.
    healthcheck:
      # No curl in the image; python is what it runs on. /openapi.json rather
      # than a business route: it needs no key, and it only answers once the
      # application has finished starting -- which is the thing being asked.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Provisions the `agents` and `process_pdf` pipelines th2etl needs before the
  # backend can schedule anything. Runs to completion and stops -- `restart:
  # "no"` on purpose: a seed that restarts forever is a seed running
  # concurrently with itself, which this one is explicitly not safe for.
  th2etl-seed:
    profiles: [etl]
    image: ${TH2ETL_IMAGE:-apowerb/th2etl}:${TH2ETL_TAG:-0.0.12}
    pull_policy: always
    command: ["python", "-m", "th2etl.seeds.default_pipelines"]
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DB_NAME}
      DATABASE_USER: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      API_KEY: ${TH2ETL_API_KEY:-}
      # The seed writes this into every ADK block config, so it is the address
      # those blocks will call at run time. Same value as th2etl above.
      ADK_BASE_URL: ${ADK_BASE_URL:-http://apowerb:8000}
      ENCRYPT_KEY: ${ENCRYPT_KEY}
    depends_on:
      th2etl:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
  apowerb-data:
