name: apowerb

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  apowerb:
    # Pinned, like every other deployment path in this repository. `latest` is
    # a moving tag: it promises nothing about the two images having been tested
    # together, and it makes an install unreproducible -- run the quick start
    # tomorrow and you may get a different pair. This one was proven together
    # (sign-up, sign-in, an agent created and read back, the control panel API
    # answering). Override BOTH tags in `.env` when you move, never one alone:
    # the frontend and the backend cap each other in both directions.
    image: ${APOWERB_BACKEND_IMAGE:-apowerb/apowerb}:${APOWERB_BACKEND_TAG:-0.2.8}
    pull_policy: always
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      ENCRYPT_KEY: ${ENCRYPT_KEY}
      TH2_EXTENSIONS: ${TH2_EXTENSIONS:-}
      WORKING_MODE: ${WORKING_MODE:-development}
      # Shared model. Without both of these the provider is simply not offered,
      # and every agent has to carry its own API key.
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-}
      DEFAULT_LLM_API_KEY: ${DEFAULT_LLM_API_KEY:-}
      DEFAULT_LLM_API_BASE: ${DEFAULT_LLM_API_BASE:-}
      # System mailer. Empty means no system email is sent at all.
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-}
      NOTIFICATION_INTEGRATION_OWNER: ${NOTIFICATION_INTEGRATION_OWNER:-}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      # Observability. ADK reads this at startup and builds a span exporter
      # when it is set; unset, it emits nothing and costs nothing. It must be
      # set TOGETHER with COMPOSE_PROFILES=logs -- set alone, the application
      # keeps retrying an exporter that has nowhere to send. See .env.example.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-apowerb}
    volumes:
      - apowerb-data:/app/data
    ports:
      - "${TH2AGENT_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  apowerb-ui:
    # Pinned with the backend above -- see the note there. 0.1.12 is a floor:
    # 0.1.11 still bundled an SDK calling `/api/admin/organizations`, which the
    # backend stopped serving when organisations became a commercial brick.
    image: ${APOWERB_FRONTEND_IMAGE:-apowerb/apowerb-ui}:${APOWERB_FRONTEND_TAG:-0.1.12}
    pull_policy: always
    environment:
      API_URL: http://apowerb:8000
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${FRONT_PORT:-3000}:3000"
    depends_on:
      - apowerb
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────────────
  # Optional: logs and agent traces. Off by default.
  #
  #   COMPOSE_PROFILES=logs
  #   OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
  #
  # Both lines, together -- see .env.example. Nothing else in the stack
  # changes, and with the profile off these two services are not created at
  # all: `docker compose up` stays the three services it was.
  #
  # What this stores today: the agent traces ADK emits natively -- tool
  # executions with their arguments and responses, LLM calls, durations,
  # each tagged with its conversation. The `/logs` side of the ingest stays
  # empty until the application adopts the th2pulse logging bridge
  # (`th2pulse.init_observability`), which this image does not call yet.
  # ───────────────────────────────────────────────────────────────────────────
  otel-collector:
    profiles: [logs]
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib}:${OTEL_COLLECTOR_TAG:-0.159.0}
    command: ["--config=/etc/otel/config.yaml"]
    environment:
      TH2PULSE_INGEST_TOKEN: ${TH2PULSE_INGEST_TOKEN:-}
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro
    depends_on:
      th2pulse:
        condition: service_healthy
    restart: unless-stopped

  th2pulse:
    profiles: [logs]
    # Pinned, like the other two. 0.1.4 is a FLOOR, not a preference: images
    # before it never create the schema named below, so the service
    # restart-loops on "no schema has been selected to create in". And
    # everything before 0.1.3 exits on start outright -- the published 0.1.2
    # was built without the `ingest` extra and dies on "No module named
    # fastapi".
    image: ${TH2PULSE_IMAGE:-apowerb/th2pulse}:${TH2PULSE_TAG:-0.1.4}
    pull_policy: always
    environment:
      # Its own schema in the stack's Postgres rather than a second database:
      # the tables are created there on first start.
      TH2PULSE_DB_DSN: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      TH2PULSE_DB_SCHEMA: ${TH2PULSE_DB_SCHEMA:-th2pulse}
      # Required, both of them. The image binds 0.0.0.0 -- a container's
      # loopback reaches nothing -- so the endpoints have no other protection
      # and the service refuses to start without these. `/spans` serves
      # recorded tool arguments and responses; it is not a read to leave open.
      # `./scripts/generate-secrets.sh` fills them.
      TH2PULSE_INGEST_TOKEN: ${TH2PULSE_INGEST_TOKEN:-}
      TH2PULSE_QUERY_TOKEN: ${TH2PULSE_QUERY_TOKEN:-}
    # Deliberately publishes no host port: only the collector writes to it,
    # over the internal network. Note that "internal" is the whole stack
    # network -- every container here can reach it, which is why the tokens
    # above are not decoration.
    #
    # It also connects as DB_USER, the same role the application uses. That
    # keeps the stack to one database and one set of credentials, and it
    # means this service is not a smaller blast radius than the backend --
    # only a smaller surface. Give it a role of its own if that matters to
    # your deployment.
    healthcheck:
      # No curl in the image; python is what it runs on.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:4319/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  apowerb-data:
