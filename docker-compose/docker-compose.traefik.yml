services:
  traefik:
    # Épinglé au patch, comme les autres images de ce dépôt : `v3.7` suivrait
    # les correctifs sans le dire, et un tag mobile est un tag figé qui prétend
    # être courant. v3.1 datait de 2024 ; les options utilisées ci-dessous
    # (entrypoints, résolveur ACME, provider docker) n'ont pas changé de forme
    # dans la série 3.x, seule l'image bouge.
    image: traefik:v3.7.13
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.leresolver.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.leresolver.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.leresolver.acme.tlschallenge=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    restart: unless-stopped

  apowerb-ui:
    labels:
      - traefik.enable=true
      - traefik.http.routers.apowerb-ui.rule=Host(`${APP_HOST:?set APP_HOST in .env}`)
      - traefik.http.routers.apowerb-ui.entrypoints=websecure
      - traefik.http.routers.apowerb-ui.tls.certresolver=leresolver
      - traefik.http.services.apowerb-ui.loadbalancer.server.port=3000
    ports: []

volumes:
  traefik-letsencrypt:
