services:
  traefik:
    # Pinned to the patch, like the other images in this repository: `v3.7` would
    # follow fixes without saying so, and a moving tag is a frozen tag that
    # pretends to be current. v3.1 dated from 2024; the options used below
    # (entrypoints, ACME resolver, docker provider) have not changed shape
    # across the 3.x series, only the image moves.
    image: traefik:v3.7.13
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.leresolver.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.leresolver.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.leresolver.acme.tlschallenge=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    restart: unless-stopped

  apowerb-ui:
    labels:
      - traefik.enable=true
      - traefik.http.routers.apowerb-ui.rule=Host(`${APP_HOST:?set APP_HOST in .env}`)
      - traefik.http.routers.apowerb-ui.entrypoints=websecure
      - traefik.http.routers.apowerb-ui.tls.certresolver=leresolver
      - traefik.http.services.apowerb-ui.loadbalancer.server.port=3000
    # `!reset`, not `[]`: Compose merges `ports` across files, so an empty
    # list removes nothing. Measured 08/10/2026 -- with `ports: []` the
    # interface stayed published on 0.0.0.0:3000 and the API on 0.0.0.0:8000,
    # plain HTTP beside the HTTPS this overlay exists for.
    # tests/test_traefik_overlay.py checks the merged result.
    ports: !reset []

  apowerb:
    # The browser never calls the API directly: the interface proxies `/api`
    # over the internal network. Traefik is the only way in.
    ports: !reset []

volumes:
  traefik-letsencrypt:
