# Compose file for Hostman App Platform.
#
# App Platform reads `docker-compose.yml` from the repository ROOT, so this file
# lives at the root of the `hostman` branch. The root file on `main` targets a
# plain VM or a laptop and keeps its own Postgres; the two cannot be one file.
#
# Every difference below is imposed by the platform, and each was checked
# against its documentation and against a real stack:
#
#   1. `volumes` and `volumes_from` are PROHIBITED. There is therefore no
#      Postgres service here -- the database is a managed Hostman cluster.
#      Nothing else needs a volume: `/app/data` stays empty, and
#      `/app/agents_pool` is REGENERATED from the database at every start
#      (verified with `--force-recreate`: the agent files came back), so a
#      redeployment loses no agent.
#
#   2. Proxying to the public domain is wired to the FIRST service listed, so
#      `apowerb-ui` comes first. With the usual ordering the platform would
#      publish Postgres, or the backend, instead of the interface.
#
#   3. Ports 80 and 443 are reserved for the platform's own Nginx and must not
#      be used as host ports.
#
# The backend deliberately publishes NO host port: the browser never talks to it
# directly, the interface proxies every `/api` call over the internal network.
# Publishing it would expose the authentication API in the clear, next to the
# platform's TLS. If the interface cannot reach the backend, that internal
# network is the first thing to look at -- not a missing port.

name: apowerb

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # FIRST on purpose: this is the service the platform proxies to the domain.
  # ─────────────────────────────────────────────────────────────────────────────
  apowerb-ui:
    # PINNED, deliberately. `latest` is a moving tag: it promises nothing about
    # the two images having been tested together, and it makes a deployment
    # unreproducible -- redeploy tomorrow and you may get a different pair.
    #
    # This couple was proven together: sign-up, sign-in, an agent created and
    # read back, and the designated e-mail becoming ADMIN on sign-up.
    #
    # 0.1.11 is a FLOOR for the frontend, not a preference. 0.1.10 shipped the
    # control panel screen but its proxy read `params` as an object where this
    # Next version hands a Promise, so every `/api/admin/*` call left as
    # `/api/admin/` and came back 404 -- the screen rendered and said "Not
    # Found" against a healthy backend. Below 0.1.10 the panel is missing
    # outright. Older floors still hold:
    # sign-up answers 502 on 0.1.6 and earlier; up to 0.1.7 the sidebar named
    # pages that ship only in commercial bricks; up to 0.1.8 the supervision
    # screen was still served to anyone typing its URL.
    #
    # Override both tags together when you move, never one alone.
    image: ${APOWERB_FRONTEND_IMAGE:-apowerb/apowerb-ui}:${APOWERB_FRONTEND_TAG:-0.1.11}
    pull_policy: always
    environment:
      # Server-side only, read at runtime by the route handlers.
      API_URL: http://apowerb:8000
      # NEXT_PUBLIC_API_URL is deliberately NOT set. It is inlined at build
      # time, so setting it here changes nothing; unset, the client falls back
      # to relative URLs and reaches the backend through this proxy, which is
      # what we want -- the browser never needs the backend's address.
    ports:
      - "${FRONT_PORT:-3000}:3000"
    depends_on:
      - apowerb
    restart: unless-stopped

  apowerb:
    # Pinned to the version proven with the frontend above. 0.2.5 is a FLOOR,
    # and the two tags MUST move together: the frontend above ships the
    # control panel screen, and only 0.2.5 serves `/api/admin` for it. Pair it
    # with 0.2.4 and the screen is there while the API is not.
    # Earlier floors still hold: images before 0.2.3 ignore
    # DEFAULT_SUPERADMIN_EMAIL unless the account already exists (never true on
    # a new install), and images before 0.2.4 still serve
    # `/api/supervision/sessions` from the core -- a route this open-source
    # stack ships no screen for.
    image: ${APOWERB_BACKEND_IMAGE:-apowerb/apowerb}:${APOWERB_BACKEND_TAG:-0.2.5}
    pull_policy: always
    environment:
      # ── Managed cluster (Hostman > Databases), not a service of this stack ──
      # Point this at a database of its OWN. Reusing one that already holds
      # apowerb tables created by ANOTHER PostgreSQL role leaves the server
      # running but unusable: every migration fails with "must be owner of
      # table user", the bootstrap administrator is never created, and startup
      # still reports success. Measured on a real deployment.
      #
      # Prefer the cluster's PRIVATE address when the app sits in the same
      # region: the connection is NOT encrypted today (DB_SSLMODE is accepted
      # but not applied to the app's own connection), so a public address would
      # carry credentials in the clear across the internet.
      # `:?` on every field the server cannot start without. The database is
      # a separate resource, created BEFORE the app, so these values are always
      # known by the time the app is deployed -- there is nothing to be gained
      # by starting without them.
      #
      # Failing here is the better failure. Without it the stack comes up, the
      # frontend serves, and the backend restarts in a loop behind it: an
      # application that looks deployed and cannot be used. The server's own
      # guard then only shows up in the logs, which is far too late and far too
      # quiet.
      DB_HOST: ${DB_HOST:?set DB_HOST -- the managed cluster address}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?set DB_NAME -- use a database of its own, see below}
      DB_USER: ${DB_USER:?set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      # The 21 tables are created on first start, in the `public` schema.
      DB_SCHEMA: ${DB_SCHEMA:-public}

      # ── Required ──
      # A valid Fernet key (32 bytes, url-safe base64 -- 44 characters).
      # Generate with: openssl rand -base64 32
      # WARNING: changing it makes every already connected integration
      # unreadable.
      ENCRYPT_KEY: ${ENCRYPT_KEY:?set ENCRYPT_KEY -- a Fernet key, `openssl rand -base64 32`}

      # ── Shared model ──
      # BOTH are needed. With only one, the provider is not offered at all --
      # silently -- and every agent has to carry its own API key.
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-}
      DEFAULT_LLM_API_KEY: ${DEFAULT_LLM_API_KEY:-}
      DEFAULT_LLM_API_BASE: ${DEFAULT_LLM_API_BASE:-}

      # ── Edition ──
      # Empty = open-source edition. Commercial bricks are named here and must
      # be installed in the image.
      TH2_EXTENSIONS: ${TH2_EXTENSIONS:-}

      # ── First administrator ──
      # On a new database nobody is an ADMIN: `role` defaults to USER and no
      # route exposes it. Set the e-mail to create (or promote) the account.
      # No default is shipped -- a default password is a published password.
      #   unknown account + password -> created, as ADMIN
      #   unknown account, no password -> nothing (an account nobody can sign
      #                                   into helps no one)
      #   existing account -> promoted, its password is NEVER rewritten
      DEFAULT_SUPERADMIN_EMAIL: ${DEFAULT_SUPERADMIN_EMAIL:-}
      DEFAULT_SUPERADMIN_PASSWORD: ${DEFAULT_SUPERADMIN_PASSWORD:-}

      # ── Mode ──
      # Left on `development` because `production` REFUSES TO START without
      # RAG_WEBHOOK_SECRET and GOOGLE_WEBHOOK_AUDIENCE, and forbids
      # BYPASS_AUTH and ENCRYPT_LEGACY_ON_BOOT. Those refusals are deliberate:
      # RAG_WEBHOOK_SECRET is the only credential guarding an unauthenticated
      # endpoint. To harden this deployment, set all three together:
      #   WORKING_MODE=production
      #   RAG_WEBHOOK_SECRET=$(openssl rand -hex 32)
      #   GOOGLE_WEBHOOK_AUDIENCE=<the real audience, never "tbd">
      # `production` also marks the session cookie Secure, which the platform's
      # HTTPS domain satisfies -- but a plain-HTTP test on the raw IP would then
      # fail to log in.
      WORKING_MODE: ${WORKING_MODE:-development}
      RAG_WEBHOOK_SECRET: ${RAG_WEBHOOK_SECRET:-}
      GOOGLE_WEBHOOK_AUDIENCE: ${GOOGLE_WEBHOOK_AUDIENCE:-}
    restart: unless-stopped
