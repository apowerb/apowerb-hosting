# Compose file for Hostman App Platform. NOT the self-hosted stack.
#
# For a laptop, a plain VM, or a Kubernetes-free host of your own, use
# `docker-compose/docker-compose.yml` instead -- it ships its own Postgres and
# needs no managed database. See `docker-compose/README.md`.
#
# This file sits at the repository ROOT because App Platform reads
# `docker-compose.yml` from there and from nowhere else. That is the only
# reason: the root of an open-source repository would otherwise belong to the
# stack most people run. The two cannot be one file -- the platform forbids
# what the self-hosted stack is built on -- so the root is spent on the one
# that has no choice about where it lives.
#
# Every difference below is imposed by the platform, and each was checked
# against its documentation and against a real stack:
#
#   1. `volumes` and `volumes_from` are PROHIBITED. There is therefore no
#      Postgres service here -- the database is a managed Hostman cluster.
#      Nothing else needs a volume: `/app/data` stays empty, and
#      `/app/agents_pool` is REGENERATED from the database at every start
#      (verified with `--force-recreate`: the agent files came back), so a
#      redeployment loses no agent.
#
#   2. Proxying to the public domain is wired to the FIRST service listed, so
#      `apowerb-ui` comes first. With the usual ordering the platform would
#      publish Postgres, or the backend, instead of the interface.
#
#   3. Ports 80 and 443 are reserved for the platform's own Nginx and must not
#      be used as host ports.
#
# The backend deliberately publishes NO host port: the browser never talks to it
# directly, the interface proxies every `/api` call over the internal network.
# Publishing it would expose the authentication API in the clear, next to the
# platform's TLS. If the interface cannot reach the backend, that internal
# network is the first thing to look at -- not a missing port.
#
# ⚠️ The platform redeploys the FIRST service on a commit and has been observed
# leaving the second one on its previous image (19/08 and 04/09: the interface
# moved, the backend did not, and `/api/admin/users` answered 404 behind a
# control panel that rendered fine). After a deployment, prove the BACKEND
# moved -- `/api/admin/users` must answer 401, not 404 -- and redeploy that
# service by hand if it did not.
#
# `name:` below is shared with `docker-compose/docker-compose.yml` on purpose:
# renaming either one would orphan the containers of every stack already
# running. Do not run both on the same host.

name: apowerb

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # FIRST on purpose: this is the service the platform proxies to the domain.
  # ─────────────────────────────────────────────────────────────────────────────
  apowerb-ui:
    # PINNED, deliberately, and on this platform that is not a preference.
    #
    # Measured on this very app, 04/09, two deployments of the same repository:
    # with `APOWERB_BACKEND_TAG=latest` the deploy log shows NO `Pulling` line,
    # finishes in 5s and reports success -- while the container keeps running
    # the image already in the host's cache. With an explicit version tag the
    # same deploy shows `apowerb Pulling` .. `Pulled`, takes 49s, and the new
    # code is actually there. `pull_policy: always` below does not survive the
    # platform's own compose handling.
    #
    # The consequence is worse than an unreproducible install: for three weeks
    # this deployment served a backend from 18/08 while its tag said `latest`,
    # and nothing anywhere contradicted that -- not the panel, not the deploy
    # log. A moving tag here is a frozen tag that claims to be current.
    #
    # `latest` also promises nothing about the two images having been tested
    # together -- redeploy tomorrow and you may get a different pair.
    #
    # This couple was proven together: sign-up, sign-in, an agent created and
    # read back, and the designated e-mail becoming ADMIN on sign-up.
    #
    # 0.1.12 is a FLOOR for the frontend, not a preference, and it is the
    # floor imposed by the backend below. 0.1.11 still bundled an SDK
    # reaching `/api/admin/organizations`, which backend 0.2.6 stopped
    # serving when organisations became a commercial brick -- measured on the
    # two backends side by side, that path answers 401 on 0.2.5 and 404 on
    # 0.2.6 while `/api/admin/users` answers 401 on both. Counted in the
    # images themselves: 20 occurrences in 0.1.11, 0 in 0.1.12.
    #
    # Older floors still hold. 0.1.10 shipped the control panel screen but
    # its proxy read `params` as an object where this Next version hands a
    # Promise, so every `/api/admin/*` call left as `/api/admin/` and came
    # back 404 -- the screen rendered and said "Not Found" against a healthy
    # backend. Below 0.1.10 the panel is missing outright. Sign-up answers
    # 502 on 0.1.6 and earlier; up to 0.1.7 the sidebar named pages that ship
    # only in commercial bricks; up to 0.1.8 the supervision screen was still
    # served to anyone typing its URL.
    #
    # Override both tags together when you move, never one alone.
    image: ${APOWERB_FRONTEND_IMAGE:-apowerb/apowerb-ui}:${APOWERB_FRONTEND_TAG:-0.1.12}
    pull_policy: always
    environment:
      # Server-side only, read at runtime by the route handlers.
      API_URL: http://apowerb:8000
      # NEXT_PUBLIC_API_URL is deliberately NOT set. It is inlined at build
      # time, so setting it here changes nothing; unset, the client falls back
      # to relative URLs and reaches the backend through this proxy, which is
      # what we want -- the browser never needs the backend's address.
    ports:
      - "${FRONT_PORT:-3000}:3000"
    depends_on:
      - apowerb
    restart: unless-stopped

  apowerb:
    # Pinned to the version proven with the frontend above, and the two tags
    # MUST move together -- in both directions. 0.2.5 remains the FLOOR: the
    # frontend ships the control panel screen and only 0.2.5 serves
    # `/api/admin` for it, so pairing it with 0.2.4 leaves the screen there
    # while the API is not. 0.2.6 adds a CEILING to the frontend instead: it
    # stopped serving `/api/admin/organizations`, which 0.1.11 still called.
    #
    # Earlier floors still hold: images before 0.2.3 ignore
    # DEFAULT_SUPERADMIN_EMAIL unless the account already exists (never true on
    # a new install), and images before 0.2.4 still serve
    # `/api/supervision/sessions` from the core -- a route this open-source
    # stack ships no screen for.
    #
    # Moved 0.2.6 -> 0.2.8 on 04/09. What was measured, and only that: no route
    # the 0.1.12 frontend calls DISAPPEARED. Both images were probed side by
    # side against the concrete `/api` paths extracted from that bundle, with
    # `/api/agents` answering 401 on both as the positive witness and an
    # invented `/api/admin/...` answering 404 as the negative one. No path
    # answers 404 on one and not the other, so the ceiling this file exists to
    # guard against did not move.
    #
    # That is route EXISTENCE, not route signatures. `GET /api/webhooks/logs`
    # did change: 0.2.8 adds optional query parameters and a `total` key
    # alongside `logs`. Both are additive, which is why the frontend does not
    # notice -- but "no difference" would be the wrong thing to remember.
    #
    # The reason to be on 0.2.8 is a data-loss bug fixed in `update_agent`.
    # Before it, every column was written unconditionally, so a field the edit
    # form does not expose arrived as None and WIPED the stored value: saving
    # an agent to change its model silently cleared `output_key`,
    # `output_schema_name`, `skip_when_upstream` and three more. An ADK
    # sequential pipeline then stops handing state between sub-agents while
    # still returning 200 -- wrong results, no error. 0.2.8 reads Pydantic's
    # `model_fields_set` and leaves omitted fields alone.
    #
    # Upgrading in place was proven on the same database: a schema created by
    # 0.2.3 came up under 0.2.8 with 16 -> 22 tables created on start, the
    # pre-existing account still signing in, the agent created beforehand read
    # back, no restart loop. The way BACK was proven too, which is what makes
    # this reversible: a database migrated by 0.2.8 (22 tables) served by a
    # 0.2.6 backend starts clean, signs the same account in, reads the same
    # agent back, and logs no error. Pinning forward is not a one-way door.
    image: ${APOWERB_BACKEND_IMAGE:-apowerb/apowerb}:${APOWERB_BACKEND_TAG:-0.2.8}
    pull_policy: always
    environment:
      # ── Managed cluster (Hostman > Databases), not a service of this stack ──
      # Point this at a database of its OWN. Reusing one that already holds
      # apowerb tables created by ANOTHER PostgreSQL role leaves the server
      # running but unusable: every migration fails with "must be owner of
      # table user", the bootstrap administrator is never created, and startup
      # still reports success. Measured on a real deployment.
      #
      # Prefer the cluster's PRIVATE address when the app sits in the same
      # region: the connection is NOT encrypted today (DB_SSLMODE is accepted
      # but not applied to the app's own connection), so a public address would
      # carry credentials in the clear across the internet.
      # `:?` on every field the server cannot start without. The database is
      # a separate resource, created BEFORE the app, so these values are always
      # known by the time the app is deployed -- there is nothing to be gained
      # by starting without them.
      #
      # Failing here is the better failure. Without it the stack comes up, the
      # frontend serves, and the backend restarts in a loop behind it: an
      # application that looks deployed and cannot be used. The server's own
      # guard then only shows up in the logs, which is far too late and far too
      # quiet.
      # This message is the signpost for anyone who cloned the repository and ran
      # `docker compose up` at the root out of habit: DB_HOST is the first
      # variable evaluated, so it is the one they will read.
      #
      # Keep it short and keep it neutral. App Platform runs `docker compose`
      # several times per deployment -- to build, and again to scan for exposed
      # ports -- and those extra invocations do NOT receive the application's
      # environment variables, so this guard fires and is logged on EVERY
      # successful deployment (seen at 12:25 on 04/09, level INFO, followed by
      # "Deploy succeeded"). Anything phrased as a question or an accusation
      # reads as a fault in a deploy log where nothing is wrong.
      DB_HOST: ${DB_HOST:?set DB_HOST -- the managed cluster address (this root file targets Hostman App Platform; the self-hosted stack is docker-compose/docker-compose.yml, which brings its own Postgres)}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?set DB_NAME -- use a database of its own, see below}
      DB_USER: ${DB_USER:?set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      # The 21 tables are created on first start, in the `public` schema.
      DB_SCHEMA: ${DB_SCHEMA:-public}

      # ── Required ──
      # A valid Fernet key (32 bytes, url-safe base64 -- 44 characters).
      # Generate with: openssl rand -base64 32
      # WARNING: changing it makes every already connected integration
      # unreadable.
      ENCRYPT_KEY: ${ENCRYPT_KEY:?set ENCRYPT_KEY -- a Fernet key, `openssl rand -base64 32`}

      # ── Shared model ──
      # BOTH are needed. With only one, the provider is not offered at all --
      # silently -- and every agent has to carry its own API key.
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-}
      DEFAULT_LLM_API_KEY: ${DEFAULT_LLM_API_KEY:-}
      DEFAULT_LLM_API_BASE: ${DEFAULT_LLM_API_BASE:-}

      # ── Edition ──
      # Empty = open-source edition. Commercial bricks are named here and must
      # be installed in the image.
      TH2_EXTENSIONS: ${TH2_EXTENSIONS:-}

      # ── First administrator ──
      # On a new database nobody is an ADMIN: `role` defaults to USER and no
      # route exposes it. Set the e-mail to create (or promote) the account.
      # No default is shipped -- a default password is a published password.
      #   unknown account + password -> created, as ADMIN
      #   unknown account, no password -> nothing (an account nobody can sign
      #                                   into helps no one)
      #   existing account -> promoted, its password is NEVER rewritten
      DEFAULT_SUPERADMIN_EMAIL: ${DEFAULT_SUPERADMIN_EMAIL:-}
      DEFAULT_SUPERADMIN_PASSWORD: ${DEFAULT_SUPERADMIN_PASSWORD:-}

      # ── Mode ──
      # Left on `development` because `production` REFUSES TO START without
      # RAG_WEBHOOK_SECRET and GOOGLE_WEBHOOK_AUDIENCE, and forbids
      # BYPASS_AUTH and ENCRYPT_LEGACY_ON_BOOT. Those refusals are deliberate:
      # RAG_WEBHOOK_SECRET is the only credential guarding an unauthenticated
      # endpoint. To harden this deployment, set all three together:
      #   WORKING_MODE=production
      #   RAG_WEBHOOK_SECRET=$(openssl rand -hex 32)
      #   GOOGLE_WEBHOOK_AUDIENCE=<the real audience, never "tbd">
      # `production` also marks the session cookie Secure, which the platform's
      # HTTPS domain satisfies -- but a plain-HTTP test on the raw IP would then
      # fail to log in.
      WORKING_MODE: ${WORKING_MODE:-development}
      RAG_WEBHOOK_SECRET: ${RAG_WEBHOOK_SECRET:-}
      GOOGLE_WEBHOOK_AUDIENCE: ${GOOGLE_WEBHOOK_AUDIENCE:-}
    restart: unless-stopped
