{{- include "apowerb.validate" . }}
{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "apowerb.secretName" . }}
  namespace: {{ include "apowerb.namespace" . }}
type: Opaque
stringData:
  DB_NAME: {{ .Values.postgres.database | quote }}
  DB_USER: {{ .Values.postgres.user | quote }}
  DB_PASSWORD: {{ .Values.postgres.password | quote }}
  ENCRYPT_KEY: {{ .Values.backend.env.encryptKey | quote }}
  TEST_TOKEN: {{ .Values.backend.env.testToken | quote }}
  {{- if .Values.th2etl.enabled }}
  TH2ETL_API_KEY: {{ .Values.th2etl.apiKey | quote }}
  {{- end }}
  {{/*
  Les cles suivantes n'existent que renseignees : une cle presente et vide
  poserait une variable vide dans le backend, ce que le coeur lit comme un
  choix et non comme une absence. Le Deployment les reference en
  `optional: true`, donc leur absence ne bloque rien.
  */}}
  {{- if .Values.defaultLlm.apiKey }}
  DEFAULT_LLM_API_KEY: {{ .Values.defaultLlm.apiKey | quote }}
  {{- end }}
  {{- if .Values.integrations.microsoft.clientSecret }}
  MICROSOFT_INTEGRATION_CLIENT_SECRET: {{ .Values.integrations.microsoft.clientSecret | quote }}
  {{- end }}
  {{- if .Values.integrations.google.clientSecret }}
  GOOGLE_INTEGRATION_CLIENT_SECRET: {{ .Values.integrations.google.clientSecret | quote }}
  {{- end }}
  {{- if .Values.storage.s3.accessKey }}
  S3_ACCESS_KEY: {{ .Values.storage.s3.accessKey | quote }}
  {{- end }}
  {{- if .Values.storage.s3.accessKeySecret }}
  S3_ACCESS_KEY_SECRET: {{ .Values.storage.s3.accessKeySecret | quote }}
  {{- end }}
  {{- if .Values.mail.password }}
  SMTP_PASSWORD: {{ .Values.mail.password | quote }}
  {{- end }}
  {{- if .Values.superadmin.password }}
  DEFAULT_SUPERADMIN_PASSWORD: {{ .Values.superadmin.password | quote }}
  {{- end }}
  {{- if .Values.ragWebhookSecret }}
  RAG_WEBHOOK_SECRET: {{ .Values.ragWebhookSecret | quote }}
  {{- end }}
  {{- if .Values.th2pulse.enabled }}
  TH2PULSE_INGEST_TOKEN: {{ .Values.th2pulse.ingestToken | quote }}
  TH2PULSE_QUERY_TOKEN: {{ .Values.th2pulse.queryToken | quote }}
  {{- if .Values.th2pulse.dsn }}
  TH2PULSE_DB_DSN: {{ .Values.th2pulse.dsn | quote }}
  {{- else }}
  TH2PULSE_DB_DSN: {{ printf "postgresql://%s:%s@%s:5432/%s" .Values.postgres.user .Values.postgres.password (include "apowerb.postgres.fullname" .) .Values.postgres.database | quote }}
  {{- end }}
  {{- end }}
{{- end }}
