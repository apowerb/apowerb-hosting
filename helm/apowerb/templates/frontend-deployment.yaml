apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apowerb.frontend.fullname" . }}
  namespace: {{ include "apowerb.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "apowerb.name" . }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "apowerb.name" . }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "apowerb.name" . }}
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.frontend.repository }}:{{ .Values.image.frontend.tag }}"
          imagePullPolicy: {{ .Values.image.frontend.pullPolicy }}
          ports:
            - containerPort: 3000
          env:
            - name: API_URL
              value: "http://{{ include "apowerb.backend.fullname" . }}:{{ .Values.service.backend.port }}"
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.backend.env.publicApiUrl | quote }}
            {{- if .Values.th2pulse.enabled }}
            # Lu par les route handlers, jamais par le navigateur : sans lui
            # l'interface interroge sa propre boucle locale et l'écran Journaux
            # annonce « magasin injoignable ».
            - name: PULSE_API_URL
              value: "http://{{ include "apowerb.th2pulse.fullname" . }}:{{ .Values.service.th2pulse.port }}"
            - name: PULSE_QUERY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "apowerb.secretName" . }}
                  key: TH2PULSE_QUERY_TOKEN
            {{- end }}
          resources:
            requests:
              cpu: {{ .Values.frontend.resources.requests.cpu }}
              memory: {{ .Values.frontend.resources.requests.memory }}
            limits:
              cpu: {{ .Values.frontend.resources.limits.cpu }}
              memory: {{ .Values.frontend.resources.limits.memory }}
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
