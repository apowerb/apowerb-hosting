replicaCount: 1
namespaceOverride: ""
# Prefix of all objects; empty means the chart name ("apowerb").
nameOverride: ""

image:
  backend:
    repository: apowerb/apowerb
    # Paired with the frontend tag below -- move both or neither.
    # 0.2.16: the bug-report API and the configurable destination repository.
    # The "report" button lives in UI 0.1.23 and calls this API: moving the UI
    # alone gives a button with no route behind it, the core alone a route
    # nothing calls.
    tag: 0.2.43
    pullPolicy: IfNotPresent
  frontend:
    repository: apowerb/apowerb-ui
    tag: 0.1.33
    pullPolicy: IfNotPresent
  postgres:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  # Pipeline orchestrator. 0.0.12 is the version whose entrypoint is
  # `python -m th2etl --serve-api`; the `th2farid/*` images from before the
  # namespace switch are NOT the same, despite identical version numbers.
  th2etl:
    repository: apowerb/th2etl
    tag: 0.0.12
    pullPolicy: IfNotPresent
  th2pulse:
    repository: apowerb/th2pulse
    tag: 0.1.4
    pullPolicy: IfNotPresent
  # Forecasting engine, published per release of apowerb/th2forecast. Only
  # pulled when th2forecast.enabled=true. Default: the R engine
  # (apowerb/th2forecast, linux/amd64 only). The Python engine
  # (apowerb/th2forecast-py: Chronos-2, events, scenarios, hierarchies) stays
  # available under the same tags -- see th2forecast.implementation.
  th2forecast:
    repository: apowerb/th2forecast
    tag: 0.1.2
    pullPolicy: IfNotPresent
  otelCollector:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.159.0
    pullPolicy: IfNotPresent

service:
  backend:
    type: ClusterIP
    port: 8000
  frontend:
    # ClusterIP by default: the front end is reached through the Ingress
    # below. It used to be `LoadBalancer`, which asks the provider for a load
    # balancer -- a billed public IP -- even when an ingress controller is
    # already there for that, and leaves the service `Pending` forever on a
    # cluster that does not offer one. Set `LoadBalancer` if you do not use an
    # Ingress; `kubectl port-forward` is enough for a trial.
    type: ClusterIP
    port: 3000
  postgres:
    type: ClusterIP
    port: 5432
  th2etl:
    type: ClusterIP
    port: 8000
  th2pulse:
    type: ClusterIP
    port: 4319
  th2forecast:
    type: ClusterIP
    port: 8000

# PostgreSQL lives INSIDE the cluster, deliberately (David, 08/09/26): the
# chart must install identically anywhere, not only at a host that offers
# managed databases. A managed database remains possible -- just disable this
# StatefulSet and point the backend elsewhere -- but it is not the default,
# and the chart depends on no provider.
postgres:
  database: th2agent
  user: th2agent
  # Empty on purpose: a password shipped by default is a published password,
  # and this one was. `helm install` refuses to proceed until it is set --
  # see _validate.tpl.
  #   --set postgres.password="$(openssl rand -hex 16)"
  password: ""
  storage: 8Gi
  storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

backend:
  env:
    dbSslmode: disable
    publicApiUrl: http://localhost:8000
    th2Extensions: ""
    workingMode: development
    encryptKey: ""
    testToken: ""
    # Postgres schema, if yours is not `public`.
    dbSchema: ""
    # Time zone of the timestamps written in the logs (e.g. Europe/Paris).
    logTz: ""

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ─────────────────────────────────────────────────────────────────────────────
# Where this installation answers, publicly.
#
# The core deduces from `appPublicUrl` everything a browser must reach: CORS
# origins, GitHub, Google and Outlook Mail callbacks. One value for nine
# settings -- provided it is NOT empty: a variable set to empty counts as
# provided and overrides the default instead of yielding to it. That is why
# nothing is emitted here while the value is missing.
#
# Left empty with an active ingress, the URL is deduced from `ingress.host`
# and `ingress.tlsEnabled`. With neither an ingress nor a value, the core
# keeps its localhost defaults and the Configuration screen says so.
# ─────────────────────────────────────────────────────────────────────────────
publicUrls:
  # The FRONT END origin, no path and no trailing slash: https://apowerb.example.
  appPublicUrl: ""
  # The API origin, which the Microsoft and Google webhooks build on. Empty,
  # it follows `appPublicUrl`: the ingress routes everything to the front end,
  # which relays `/api`. The code appends `/api/...` itself -- an origin, not
  # a path.
  publicBaseUrl: ""

# ─────────────────────────────────────────────────────────────────────────────
# Model offered to agents by default, without the user supplying a key.
# Without it, everyone must bring their own to run an agent.
# ─────────────────────────────────────────────────────────────────────────────
defaultLlm:
  model: ""
  apiKey: ""
  # OpenAI-compatible endpoint, for a third-party or local provider.
  apiBase: ""

# ─────────────────────────────────────────────────────────────────────────────
# Third-party connections. Each one must also be declared on the provider
# side, and the redirect URI must match it character for character.
#
# ⚠️ `microsoft.*` here means the INTEGRATIONS (Outlook, OneDrive, Teams).
# The MICROSOFT_* family without _INTEGRATION is used for user sign-in: two
# distinct sets of credentials, with similar names.
# ─────────────────────────────────────────────────────────────────────────────
integrations:
  microsoft:
    clientId: ""
    clientSecret: ""
    # `common` accepts all tenants; set yours to restrict it.
    tenantId: ""
    # Never deduced, on purpose: the core leaves this field empty rather than
    # point elsewhere, so that an empty value reads as "not configured".
    redirectUri: ""
    # Outlook Mail callback, distinct from the previous one. Empty, the core
    # deduces it from the public URL: `<origin>/emailing/microsoft/callback`.
    outlookMailRedirectUri: ""
  google:
    clientId: ""
    clientSecret: ""
    # Empty, deduced: `<origin>/integrations/google/callback`.
    redirectUri: ""
    # Required only by the Google webhooks.
    webhookAudience: ""

# ─────────────────────────────────────────────────────────────────────────────
# Where uploaded files go. `local` writes to the backend volume; `S3`
# requires the five fields below, otherwise the core falls back to disk.
# ─────────────────────────────────────────────────────────────────────────────
storage:
  mode: local
  s3:
    endpoint: ""
    region: ""
    bucket: ""
    accessKey: ""
    accessKeySecret: ""

# ─────────────────────────────────────────────────────────────────────────────
# System mail: address verification and password reset. Without it, a user
# who loses their password stays locked out.
# ─────────────────────────────────────────────────────────────────────────────
mail:
  host: ""
  port: ""
  from: ""
  user: ""
  password: ""

# ─────────────────────────────────────────────────────────────────────────────
# Superadmin account created at first start, if it does not already exist.
# The two fields go together: one without the other creates nothing.
# ─────────────────────────────────────────────────────────────────────────────
superadmin:
  email: ""
  password: ""

# Signature of incoming calls from the RAG service. The core ships a public
# default (`th2-webhook-default-secret`): set your own in production.
ragWebhookSecret: ""

frontend:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

secret:
  create: true

ingress:
  enabled: false
  # `nginx` or `traefik`, depending on the add-on installed on the cluster.
  className: ""
  host: apowerb.local
  # With cert-manager, the issuer is declared here:
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  annotations: {}
  # Sets the `tls` section of the Ingress. Without it, the front end is served
  # in clear text -- and address-verification links would go out as http://.
  tlsEnabled: false
  # Empty: the name is deduced (`<chart name>-tls`), which cert-manager fills
  # in by itself. Set it to reuse an existing secret.
  tlsSecretName: ""


# ─────────────────────────────────────────────────────────────────────────────
# Pipeline orchestrator (th2etl). The backend calls it only if it has
# BASE_URL *and* a key: without the key, the Orchestrator screen says "not
# configured yet" instead of failing.
# ─────────────────────────────────────────────────────────────────────────────
th2etl:
  enabled: true
  # `openssl rand -hex 32`, the same value on both sides: the backend
  # presents it, th2etl checks it.
  apiKey: ""
  seed:
    # Seeds the default pipelines into the database. A Job, not a service: it
    # terminates. Re-run on every install and upgrade -- the operation is
    # idempotent, it does not duplicate the pipelines already there.
    enabled: true
    attempts: 30
    delaySeconds: 10
    backoffLimit: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ─────────────────────────────────────────────────────────────────────────────
# Log and trace store (th2pulse): what the Logging screen reads. It shares
# apowerb's database, in a schema of its own.
# ─────────────────────────────────────────────────────────────────────────────
th2pulse:
  enabled: true
  schema: th2pulse
  # BOTH tokens are mandatory when the service is enabled: it refuses to
  # start without them. `openssl rand -hex 32` for each.
  ingestToken: ""
  # Read server-side by the front end, never sent to the browser.
  queryToken: ""
  # Set it to target an external Postgres; empty, the DSN is built from the
  # chart's Postgres.
  dsn: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ─────────────────────────────────────────────────────────────────────────────
# Forecasting engine (th2forecast): what POST /api/v1/forecast calls.
# DISABLED by default, unlike th2etl and th2pulse above: it is an optional
# feature and needs an API token shared with the backend. Image: the R
# engine apowerb/th2forecast, pinned under image.th2forecast.
# ─────────────────────────────────────────────────────────────────────────────
th2forecast:
  enabled: false
  # `openssl rand -hex 32`. Not required to start the engine -- empty, it
  # accepts unauthenticated requests, reachable only from the cluster's
  # internal network -- but _validate.tpl makes it mandatory as soon as
  # enabled=true: the backend and the engine must carry the same value, and a
  # token missing on both sides reads too easily as an oversight.
  apiToken: ""
  # Backend-side overall timeout (th2forecast_client), in seconds.
  timeoutS: 300
  # Which engine the image runs: "r" or "python", passed to the backend as
  # TH2FORECAST_ENGINE. The backend refuses requests for features the R
  # engine lacks (events, scenarios, hierarchy, reconciliation, croston/tsb/
  # imapa) instead of letting it ignore them. Empty: deduced from
  # image.th2forecast.repository (a name ending in "-py" is the Python
  # engine). Set it explicitly for an image you built or renamed.
  implementation: ""
  # Engine settings, all optional -- empty, the image defaults apply. Both
  # engines read workers and the three limits; preload, sfJobs and
  # torchThreads are read by the Python engine only. Python defaults (2
  # workers, weights loaded at startup, limits of 100000 rows / 200 series /
  # 366 days, 1 statsforecast job, one thread per core).
  engine:
    workers: ""
    preload: ""
    maxRows: ""
    maxSeries: ""
    maxHorizon: ""
    sfJobs: ""
    torchThreads: ""
  # Measured on the PYTHON engine (the R engine was not measured), 28/09/26,
  # local image, one job at a time (TH2FORECAST_WORKERS
  # default = 2 threads, same process): 316 MiB at rest once Chronos-2 is
  # loaded, 404 MiB peak during an `auto` run on 20 monthly series x 24
  # points. Request = rest x1.6; limit = peak x3.8, because two concurrent
  # jobs (2 workers) were not measured and CPU torch remains the main cost.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1536Mi

# OpenTelemetry collector: the backend sends it traces and logs, and it pushes
# them into th2pulse. Without it, OTEL_EXPORTER_OTLP_ENDPOINT stays empty and
# the Logging screen reports "not configured yet".
# ─────────────────────────────────────────────────────────────────────────────
otelCollector:
  enabled: true
  serviceName: apowerb
  metricsExporter: none
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

# ─────────────────────────────────────────────────────────────────────────────
# Backend disk: imported BI files, uploads, artifacts.
#
# Without this volume, an imported CSV disappears at the pod's first restart --
# and the dashboard that reads it dies with it. The agent pool, on the other
# hand, is regenerated from the database: that is not what is protected here.
#
# ⚠️ ReadWriteOnce can be mounted by only one node: the backend stays at one
# replica until the storage class supports ReadWriteMany.
# ─────────────────────────────────────────────────────────────────────────────
persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  mountPath: /data
