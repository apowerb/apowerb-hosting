apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apowerb.backend.fullname" . }}
  namespace: {{ include "apowerb.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "apowerb.name" . }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "apowerb.name" . }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "apowerb.name" . }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: {{ include "apowerb.postgres.fullname" . }}
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "apowerb.secretName" . }}
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "apowerb.secretName" . }}
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "apowerb.secretName" . }}
                  key: DB_PASSWORD
            - name: DB_SSLMODE
              value: {{ .Values.backend.env.dbSslmode | quote }}
            - name: ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "apowerb.secretName" . }}
                  key: ENCRYPT_KEY
            - name: TEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "apowerb.secretName" . }}
                  key: TEST_TOKEN
            {{- if .Values.backend.env.th2Extensions }}
            - name: TH2_EXTENSIONS
              value: {{ .Values.backend.env.th2Extensions | quote }}
            {{- end }}
            - name: WORKING_MODE
              value: {{ .Values.backend.env.workingMode | quote }}
            {{- if .Values.persistence.enabled }}
            # Une seule racine pour tout ce que le backend écrit sur disque :
            # `bi_store`, `uploads`, `artifacts_store` et `agents_pool` en
            # descendent. Le nom de la variable est RUNTIME_ROOT -- mesuré
            # contre le paquet, la docstring de `configs/paths.py` annonce
            # encore TH2AGENT_RUNTIME_ROOT, qui ne sert à rien.
            - name: RUNTIME_ROOT
              value: {{ .Values.persistence.mountPath | quote }}
            {{- end }}
            {{- if .Values.th2etl.enabled }}
            # Le coeur choisit son client d'orchestration par ORCHESTRATOR,
            # dont le defaut est "mage". Adresse et cle ne suffisent donc pas :
            # sans cette ligne, le backend appelle un Mage qui n'existe pas.
            # Mesure sur la demo le 08/09 -- l'ecran Orchestrateur restait vide
            # avec un th2etl parfaitement sain a cote.
            - name: ORCHESTRATOR
              value: "th2etl"
            - name: TH2ETL_BASE_URL
              value: "http://{{ include "apowerb.th2etl.fullname" . }}:{{ .Values.service.th2etl.port }}"
            - name: TH2ETL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "apowerb.secretName" . }}
                  key: TH2ETL_API_KEY
            {{- end }}
            {{- if .Values.otelCollector.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://{{ include "apowerb.otel.fullname" . }}:4318"
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otelCollector.serviceName | quote }}
            - name: OTEL_METRICS_EXPORTER
              value: {{ .Values.otelCollector.metricsExporter | quote }}
            {{- end }}
            {{- if .Values.backend.env.dbSchema }}
            - name: DB_SCHEMA
              value: {{ .Values.backend.env.dbSchema | quote }}
            {{- end }}
            {{- if .Values.backend.env.logTz }}
            - name: TH2_LOG_TZ
              value: {{ .Values.backend.env.logTz | quote }}
            {{- end }}

            {{/*
            Tout ce qui suit est optionnel, et n'est emis QUE renseigne.
            Une variable posee vide n'est pas une variable absente : elle
            compte comme fournie et remplace le defaut du coeur au lieu de
            s'effacer devant lui. C'est ce qui a valu un AADSTS90102 sur la
            demo le 08/09, redirect_uri partant vide chez Microsoft.
            */}}
            {{- with include "apowerb.appPublicUrl" . }}
            - name: APP_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with include "apowerb.publicBaseUrl" . }}
            - name: PUBLIC_BASE_URL
              value: {{ . | quote }}
            {{- end }}

            {{- if .Values.defaultLlm.model }}
            - name: DEFAULT_LLM_MODEL
              value: {{ .Values.defaultLlm.model | quote }}
            {{- end }}
            {{- if .Values.defaultLlm.apiBase }}
            - name: DEFAULT_LLM_API_BASE
              value: {{ .Values.defaultLlm.apiBase | quote }}
            {{- end }}

            {{- with .Values.integrations.microsoft }}
            {{- if .clientId }}
            - name: MICROSOFT_INTEGRATION_CLIENT_ID
              value: {{ .clientId | quote }}
            {{- end }}
            {{- if .tenantId }}
            - name: MICROSOFT_INTEGRATION_TENANT_ID
              value: {{ .tenantId | quote }}
            {{- end }}
            {{- if .redirectUri }}
            - name: MICROSOFT_INTEGRATION_REDIRECT_URI
              value: {{ .redirectUri | quote }}
            {{- end }}
            {{- if .outlookMailRedirectUri }}
            - name: OUTLOOK_MAIL_REDIRECT_URI
              value: {{ .outlookMailRedirectUri | quote }}
            {{- end }}
            {{- end }}

            {{- with .Values.integrations.google }}
            {{- if .clientId }}
            - name: GOOGLE_INTEGRATION_CLIENT_ID
              value: {{ .clientId | quote }}
            {{- end }}
            {{- if .redirectUri }}
            - name: GOOGLE_INTEGRATION_REDIRECT_URI
              value: {{ .redirectUri | quote }}
            {{- end }}
            {{- if .webhookAudience }}
            - name: GOOGLE_WEBHOOK_AUDIENCE
              value: {{ .webhookAudience | quote }}
            {{- end }}
            {{- end }}

            {{- if .Values.storage.mode }}
            # Le defaut du coeur est "S3" ; celui du compose racine est
            # "local". Le chart suit le compose, sans quoi une installation
            # sans identifiants S3 se croit en S3 jusqu'au premier depot.
            - name: STORAGE_MODE
              value: {{ .Values.storage.mode | quote }}
            {{- end }}
            {{- with .Values.storage.s3 }}
            {{- if .endpoint }}
            - name: S3_ENDPOINT
              value: {{ .endpoint | quote }}
            {{- end }}
            {{- if .region }}
            - name: S3_REGION
              value: {{ .region | quote }}
            {{- end }}
            {{- if .bucket }}
            - name: S3_BUCKET_NAME
              value: {{ .bucket | quote }}
            {{- end }}
            {{- end }}

            {{- with .Values.mail }}
            {{- if .host }}
            - name: SMTP_HOST
              value: {{ .host | quote }}
            {{- end }}
            {{- if .port }}
            - name: SMTP_PORT
              value: {{ .port | quote }}
            {{- end }}
            {{- if .from }}
            - name: SMTP_FROM
              value: {{ .from | quote }}
            {{- end }}
            {{- if .user }}
            - name: SMTP_USER
              value: {{ .user | quote }}
            {{- end }}
            {{- end }}

            {{- if .Values.superadmin.email }}
            - name: DEFAULT_SUPERADMIN_EMAIL
              value: {{ .Values.superadmin.email | quote }}
            {{- end }}

            {{/*
            Les valeurs sensibles passent par le Secret, jamais par le
            Deployment -- `kubectl get deploy -o yaml` est bien plus largement
            lisible qu'un Secret. `optional: true` fait le reste : la cle
            n'existe dans le Secret que si elle a une valeur, et sans elle la
            variable n'est simplement pas posee. Un Secret fourni de
            l'exterieur (`secret.create=false`) peut donc porter ces cles sans
            qu'on ait a repeter les valeurs dans les values.
            */}}
            {{- range $var, $key := dict
                  "DEFAULT_LLM_API_KEY" "DEFAULT_LLM_API_KEY"
                  "MICROSOFT_INTEGRATION_CLIENT_SECRET" "MICROSOFT_INTEGRATION_CLIENT_SECRET"
                  "GOOGLE_INTEGRATION_CLIENT_SECRET" "GOOGLE_INTEGRATION_CLIENT_SECRET"
                  "S3_ACCESS_KEY" "S3_ACCESS_KEY"
                  "S3_ACCESS_KEY_SECRET" "S3_ACCESS_KEY_SECRET"
                  "SMTP_PASSWORD" "SMTP_PASSWORD"
                  "DEFAULT_SUPERADMIN_PASSWORD" "DEFAULT_SUPERADMIN_PASSWORD"
                  "RAG_WEBHOOK_SECRET" "RAG_WEBHOOK_SECRET" }}
            - name: {{ $var }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "apowerb.secretName" $ }}
                  key: {{ $key }}
                  optional: true
            {{- end }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath | quote }}
          {{- end }}
          resources:
            requests:
              cpu: {{ .Values.backend.resources.requests.cpu }}
              memory: {{ .Values.backend.resources.requests.memory }}
            limits:
              cpu: {{ .Values.backend.resources.limits.cpu }}
              memory: {{ .Values.backend.resources.limits.memory }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "apowerb.data.fullname" . }}
      {{- end }}
