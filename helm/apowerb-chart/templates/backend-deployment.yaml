apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apowerb.backend.fullname" . }}
  namespace: {{ include "apowerb.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "apowerb.name" . }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.replicaCount }}
  # The backend mounts the `/data` PVC as ReadWriteOnce: only one node can
  # attach it. With the default RollingUpdate strategy, an upgrade creates the
  # new pod before killing the old one; if it lands on another node, it stays
  # stuck in "Multi-Attach error" until the volume detaches (several minutes),
  # and two backends can hit the database during the overlap. Recreate stops
  # the old pod before starting the new one: no volume conflict, a clean
  # cut-over.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "apowerb.name" . }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "apowerb.name" . }}
        app.kubernetes.io/component: backend
    spec:
      initContainers:
        {{- include "apowerb.waitForPostgres" . | nindent 8 }}
      containers:
        - name: backend
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: {{ include "apowerb.postgres.fullname" . }}
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "apowerb.secretName" . }}
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "apowerb.secretName" . }}
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "apowerb.secretName" . }}
                  key: DB_PASSWORD
            - name: DB_SSLMODE
              value: {{ .Values.backend.env.dbSslmode | quote }}
            - name: ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "apowerb.secretName" . }}
                  key: ENCRYPT_KEY
            - name: TEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "apowerb.secretName" . }}
                  key: TEST_TOKEN
            {{- if .Values.backend.env.th2Extensions }}
            - name: TH2_EXTENSIONS
              value: {{ .Values.backend.env.th2Extensions | quote }}
            {{- end }}
            - name: WORKING_MODE
              value: {{ .Values.backend.env.workingMode | quote }}
            {{- if .Values.persistence.enabled }}
            # A single root for everything the backend writes to disk:
            # `bi_store`, `uploads`, `artifacts_store` and `agents_pool` are
            # all under it. The variable is named RUNTIME_ROOT -- measured
            # against the package; the docstring of `configs/paths.py` still
            # says TH2AGENT_RUNTIME_ROOT, which does nothing.
            - name: RUNTIME_ROOT
              value: {{ .Values.persistence.mountPath | quote }}
            {{- end }}
            {{- if .Values.th2etl.enabled }}
            # The core picks its orchestration client through ORCHESTRATOR,
            # whose default is "mage". Address and key are therefore not
            # enough: without this line, the backend calls a Mage that does not
            # exist. Measured on the demo on 08/09 -- the Orchestrator screen
            # stayed empty with a perfectly healthy th2etl next to it.
            - name: ORCHESTRATOR
              value: "th2etl"
            - name: TH2ETL_BASE_URL
              value: "http://{{ include "apowerb.th2etl.fullname" . }}:{{ .Values.service.th2etl.port }}"
            - name: TH2ETL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "apowerb.secretName" . }}
                  key: TH2ETL_API_KEY
            {{- end }}
            {{- if .Values.otelCollector.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://{{ include "apowerb.otel.fullname" . }}:4318"
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otelCollector.serviceName | quote }}
            - name: OTEL_METRICS_EXPORTER
              value: {{ .Values.otelCollector.metricsExporter | quote }}
            {{- end }}
            {{- if .Values.th2forecast.enabled }}
            # Empty TH2FORECAST_URL is a working state: th2forecast_client
            # raises Th2forecastNotConfigured and POST /api/v1/forecast
            # answers 503 rather than calling nowhere. Only emitted when the
            # engine is actually deployed, so the default install carries
            # neither knob nor a URL pointing at a service that is not there.
            - name: TH2FORECAST_URL
              value: "http://{{ include "apowerb.th2forecast.fullname" . }}:{{ .Values.service.th2forecast.port }}"
            - name: TH2FORECAST_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "apowerb.secretName" . }}
                  key: TH2FORECAST_API_TOKEN
                  optional: true
            - name: TH2FORECAST_TIMEOUT_S
              value: {{ .Values.th2forecast.timeoutS | quote }}
            {{- end }}
            {{- if .Values.backend.env.dbSchema }}
            - name: DB_SCHEMA
              value: {{ .Values.backend.env.dbSchema | quote }}
            {{- end }}
            {{- if .Values.backend.env.logTz }}
            - name: TH2_LOG_TZ
              value: {{ .Values.backend.env.logTz | quote }}
            {{- end }}

            {{/*
            Everything below is optional, and is emitted ONLY when set.
            A variable set to empty is not an absent variable: it counts as
            provided and overrides the core's default instead of yielding to
            it. That is what caused an AADSTS90102 on the demo on 08/09, with
            redirect_uri going out empty to Microsoft.
            */}}
            {{- with include "apowerb.appPublicUrl" . }}
            - name: APP_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with include "apowerb.publicBaseUrl" . }}
            - name: PUBLIC_BASE_URL
              value: {{ . | quote }}
            {{- end }}

            {{- if .Values.defaultLlm.model }}
            - name: DEFAULT_LLM_MODEL
              value: {{ .Values.defaultLlm.model | quote }}
            {{- end }}
            {{- if .Values.defaultLlm.apiBase }}
            - name: DEFAULT_LLM_API_BASE
              value: {{ .Values.defaultLlm.apiBase | quote }}
            {{- end }}

            {{- with .Values.integrations.microsoft }}
            {{- if .clientId }}
            - name: MICROSOFT_INTEGRATION_CLIENT_ID
              value: {{ .clientId | quote }}
            {{- end }}
            {{- if .tenantId }}
            - name: MICROSOFT_INTEGRATION_TENANT_ID
              value: {{ .tenantId | quote }}
            {{- end }}
            {{- if .redirectUri }}
            - name: MICROSOFT_INTEGRATION_REDIRECT_URI
              value: {{ .redirectUri | quote }}
            {{- end }}
            {{- if .outlookMailRedirectUri }}
            - name: OUTLOOK_MAIL_REDIRECT_URI
              value: {{ .outlookMailRedirectUri | quote }}
            {{- end }}
            {{- end }}

            {{- with .Values.integrations.google }}
            {{- if .clientId }}
            - name: GOOGLE_INTEGRATION_CLIENT_ID
              value: {{ .clientId | quote }}
            {{- end }}
            {{- if .redirectUri }}
            - name: GOOGLE_INTEGRATION_REDIRECT_URI
              value: {{ .redirectUri | quote }}
            {{- end }}
            {{- if .webhookAudience }}
            - name: GOOGLE_WEBHOOK_AUDIENCE
              value: {{ .webhookAudience | quote }}
            {{- end }}
            {{- end }}

            {{- if .Values.storage.mode }}
            # The core's default is "S3"; the root compose file's is "local".
            # The chart follows the compose file, otherwise an installation
            # without S3 credentials believes it is on S3 until the first
            # upload.
            - name: STORAGE_MODE
              value: {{ .Values.storage.mode | quote }}
            {{- end }}
            {{- with .Values.storage.s3 }}
            {{- if .endpoint }}
            - name: S3_ENDPOINT
              value: {{ .endpoint | quote }}
            {{- end }}
            {{- if .region }}
            - name: S3_REGION
              value: {{ .region | quote }}
            {{- end }}
            {{- if .bucket }}
            - name: S3_BUCKET_NAME
              value: {{ .bucket | quote }}
            {{- end }}
            {{- end }}

            {{- with .Values.mail }}
            {{- if .host }}
            - name: SMTP_HOST
              value: {{ .host | quote }}
            {{- end }}
            {{- if .port }}
            - name: SMTP_PORT
              value: {{ .port | quote }}
            {{- end }}
            {{- if .from }}
            - name: SMTP_FROM
              value: {{ .from | quote }}
            {{- end }}
            {{- if .user }}
            - name: SMTP_USER
              value: {{ .user | quote }}
            {{- end }}
            {{- end }}

            {{- if .Values.superadmin.email }}
            - name: DEFAULT_SUPERADMIN_EMAIL
              value: {{ .Values.superadmin.email | quote }}
            {{- end }}

            {{/*
            Sensitive values go through the Secret, never through the
            Deployment -- `kubectl get deploy -o yaml` is readable far more
            widely than a Secret. `optional: true` does the rest: the key
            exists in the Secret only if it has a value, and without it the
            variable is simply not set. A Secret supplied from outside
            (`secret.create=false`) can therefore carry these keys without the
            values having to be repeated in the values file.
            */}}
            {{- range $var, $key := dict
                  "DEFAULT_LLM_API_KEY" "DEFAULT_LLM_API_KEY"
                  "MICROSOFT_INTEGRATION_CLIENT_SECRET" "MICROSOFT_INTEGRATION_CLIENT_SECRET"
                  "GOOGLE_INTEGRATION_CLIENT_SECRET" "GOOGLE_INTEGRATION_CLIENT_SECRET"
                  "S3_ACCESS_KEY" "S3_ACCESS_KEY"
                  "S3_ACCESS_KEY_SECRET" "S3_ACCESS_KEY_SECRET"
                  "SMTP_PASSWORD" "SMTP_PASSWORD"
                  "DEFAULT_SUPERADMIN_PASSWORD" "DEFAULT_SUPERADMIN_PASSWORD"
                  "RAG_WEBHOOK_SECRET" "RAG_WEBHOOK_SECRET" }}
            - name: {{ $var }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "apowerb.secretName" $ }}
                  key: {{ $key }}
                  optional: true
            {{- end }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath | quote }}
          {{- end }}
          resources:
            requests:
              cpu: {{ .Values.backend.resources.requests.cpu }}
              memory: {{ .Values.backend.resources.requests.memory }}
            limits:
              cpu: {{ .Values.backend.resources.limits.cpu }}
              memory: {{ .Values.backend.resources.limits.memory }}
          # startupProbe: gives the first start time to finish (migrations +
          # materialization of the agent pool) without the liveness probe
          # killing the pod. Until it has succeeded, readiness and liveness
          # are suspended. 30 × 5 s = up to 150 s of boot tolerated.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 30
          # readiness on /health/ready: actually checks the database and the
          # encryption key (Fernet). /health alone returns a static 200 and
          # would leave a pod "ready" while the database is unreachable --
          # the pod would receive traffic doomed to fail.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 10
          # liveness deliberately on /health (not /ready): it must only
          # check that the process is alive. Wiring it to the database would
          # restart the backend in a loop during a Postgres outage, without
          # fixing anything.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "apowerb.data.fullname" . }}
      {{- end }}
