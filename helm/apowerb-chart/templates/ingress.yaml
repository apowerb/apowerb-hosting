{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "apowerb.name" . }}
  namespace: {{ include "apowerb.namespace" . }}
  annotations:
{{- with .Values.ingress.annotations }}
{{ toYaml . | indent 4 }}
{{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "" }}
  {{- if .Values.ingress.tlsEnabled }}
  # `tlsEnabled` and `tlsSecretName` used to live in values.yaml without this
  # template reading them: enabling them did nothing, and the front end was
  # still served in clear text. The secret name is deduced when not given --
  # cert-manager creates it from the `cluster-issuer` annotation.
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecretName | default (printf "%s-tls" (include "apowerb.name" .)) | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "apowerb.frontend.fullname" . }}
                port:
                  number: {{ .Values.service.frontend.port }}
{{- end }}
