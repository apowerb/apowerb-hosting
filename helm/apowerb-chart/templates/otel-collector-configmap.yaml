{{- if .Values.otelCollector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "apowerb.otel.fullname" . }}
  namespace: {{ include "apowerb.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "apowerb.name" . }}
    app.kubernetes.io/component: otel-collector
data:
  # The compose file passes this configuration through an environment variable
  # (`--config=env:OTEL_CFG`). In Kubernetes it lives in a ConfigMap and the
  # collector reads it as a file: same content, but `kubectl edit` shows it,
  # and the ingest token does not have to appear in it -- it stays in the
  # Secret, injected at runtime through `${env:...}`.
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 75
        spike_limit_percentage: 20
      batch:
    exporters:
      otlphttp/pulse:
        endpoint: http://{{ include "apowerb.th2pulse.fullname" . }}:{{ .Values.service.th2pulse.port }}
        encoding: json
        headers:
          X-Th2Pulse-Token: ${env:TH2PULSE_INGEST_TOKEN}
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/pulse]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/pulse]
{{- end }}
