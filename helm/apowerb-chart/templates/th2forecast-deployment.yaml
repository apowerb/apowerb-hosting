{{- if .Values.th2forecast.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apowerb.th2forecast.fullname" . }}
  namespace: {{ include "apowerb.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "apowerb.name" . }}
    app.kubernetes.io/component: th2forecast
spec:
  # Les jobs vivent dans la memoire du pod (ThreadPoolExecutor, pas de file
  # partagee) : deux repliques ne partageraient pas leurs jobs en cours, donc
  # une requete de suivi (GET /v1/jobs/{id}) qui retombe sur l'autre pod
  # repondrait "introuvable". Le HPA n'est pas une option tant que ca reste
  # vrai.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "apowerb.name" . }}
      app.kubernetes.io/component: th2forecast
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "apowerb.name" . }}
        app.kubernetes.io/component: th2forecast
    spec:
      containers:
        - name: th2forecast
          image: "{{ .Values.image.th2forecast.repository }}:{{ .Values.image.th2forecast.tag }}"
          imagePullPolicy: {{ .Values.image.th2forecast.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            {{- include "apowerb.th2forecast.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.th2forecast.resources | nindent 12 }}
          # Chronos-2 se charge au demarrage (TH2FORECAST_PRELOAD par defaut)
          # avant que /health reponde : mesure du 28/09/26, image locale,
          # 4.6 s du demarrage du conteneur au premier /health 200. Le plafond
          # ci-dessous (180 s) laisse une marge large pour un noeud plus lent
          # ou une image tiree a froid.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
{{- end }}
