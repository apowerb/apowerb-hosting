{{- if and .Values.th2etl.enabled .Values.th2etl.seed.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "apowerb.th2etl.fullname" . }}-seed
  namespace: {{ include "apowerb.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "apowerb.name" . }}
    app.kubernetes.io/component: th2etl-seed
  annotations:
    # Un Job, pas un Deployment : la pose des pipelines par défaut se termine.
    # En Deployment, Kubernetes relancerait le conteneur sorti en 0 à l'infini
    # (CrashLoopBackOff sur un succès) -- c'est le piège que le compose évite
    # avec `restart: "no"`.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.th2etl.seed.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "apowerb.name" . }}
        app.kubernetes.io/component: th2etl-seed
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: "{{ .Values.image.th2etl.repository }}:{{ .Values.image.th2etl.tag }}"
          imagePullPolicy: {{ .Values.image.th2etl.pullPolicy }}
          # Le seed écrit dans la base, il n'appelle pas l'API -- mais il
          # attend que la base ait été migrée par th2etl, d'où la boucle.
          command: ["sh", "-c"]
          args:
            - >-
              for i in $(seq 1 {{ .Values.th2etl.seed.attempts }}); do
              python -m th2etl.seeds.default_pipelines && exit 0;
              echo "seed: attempt $i failed, th2etl not ready yet";
              sleep {{ .Values.th2etl.seed.delaySeconds }};
              done; exit 1
          env:
            {{- include "apowerb.th2etl.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.th2etl.seed.resources | nindent 12 }}
{{- end }}
