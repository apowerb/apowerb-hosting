{{- if .Values.th2etl.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apowerb.th2etl.fullname" . }}
  namespace: {{ include "apowerb.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "apowerb.name" . }}
    app.kubernetes.io/component: th2etl
spec:
  # The orchestrator runs a scheduler: two replicas would run the same
  # scheduled pipeline twice.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "apowerb.name" . }}
      app.kubernetes.io/component: th2etl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "apowerb.name" . }}
        app.kubernetes.io/component: th2etl
    spec:
      initContainers:
        {{- include "apowerb.waitForPostgres" . | nindent 8 }}
      containers:
        - name: th2etl
          image: "{{ .Values.image.th2etl.repository }}:{{ .Values.image.th2etl.tag }}"
          imagePullPolicy: {{ .Values.image.th2etl.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            {{- include "apowerb.th2etl.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.th2etl.resources | nindent 12 }}
          # The image does not serve /health: `/openapi.json` is what the
          # compose healthcheck already queries, and what the 0.0.11/0.0.12
          # switch measured on both sides.
          readinessProbe:
            httpGet:
              path: /openapi.json
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /openapi.json
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
{{- end }}
