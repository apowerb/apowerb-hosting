name: Docs in sync

# This repository decides what is deployed; `apowerb-docs` tells the world how
# to install it. When the two diverge, the docs are what people read.
#
# On 08/09/2026, `docs.apowerb.com` served for an hour
# `helm install apowerb oci://registry-1.docker.io/apowerb/apowerb --version 0.2.0`
# while the chart was called `apowerb-chart` and was at 0.4.1. Nobody
# noticed, for a reason worth remembering: the stale command WORKED. The old
# chart can still be pulled, and simply installed the stack as it was before
# th2etl, th2pulse and the persistent volume.
#
# The guard does not require the docs to be merged first -- an open PR that
# fixes them is enough, because preparing both together is the expected practice.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Do the docs say what this repository deploys?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The workflow token is enough: `apowerb-docs` is public, and without it
      # the anonymous quota (60 calls per hour) would run out with several PRs.
      - name: Compare the chart with what the docs say
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_docs_in_sync.py
