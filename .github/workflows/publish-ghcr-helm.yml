name: Publish Helm chart to GitHub Container Registry

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish-helm-oci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Derive release version
        id: release
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Lint chart
        run: helm lint ./helm/apowerb

      - name: Package chart with release version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          helm package ./helm/apowerb --version "$VERSION"

      - name: Login to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | helm registry login ghcr.io \
            --username "$GHCR_USERNAME" \
            --password-stdin

      - name: Push chart to GitHub Container Registry
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          CHART_TGZ="apowerb-${VERSION}.tgz"
          helm push "$CHART_TGZ" "oci://ghcr.io/${{ github.repository_owner }}/apowerb"
