name: Propose image bump

# The tag must stay explicit on this platform -- `latest` lies here, measured
# on 04/09 and re-verified on 09/09. But changing it BY HAND in the panel
# is not inevitable: this workflow opens the PR, a human reviews it.
#
# It merges nothing and deploys nothing. The review remains the moment when
# the compose contract guard weighs in on the settings a new core version
# brings -- exactly what happened with 0.2.13 and its three caps.

on:
  schedule:
    # Once per working day, in the morning, Paris time.
    - cron: '15 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  proposer:
    name: Is a newer image published?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # An already-open bump PR is enough: opening a new one every morning
      # would turn a signal into noise, and noise does not get read.
      - name: Is a bump PR already open?
        id: deja
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # By PREFIX: since each proposal carries its own branch
          # (see the opening step), `--head chore/bump-images` would find
          # nothing anymore and the workflow would open a PR every morning.
          n=$(gh pr list --state open --json headRefName \
                --jq '[.[] | select(.headRefName | startswith("chore/bump-images"))] | length')
          echo "ouverte=$n" >> "$GITHUB_OUTPUT"
          [ "$n" = "0" ] || echo "A bump PR is already open: nothing to do."

      # The plain manifests in k8s/ are rendered from the chart: a bump that
      # moves the chart must move them too, or the k8s-manifests check fails.
      - name: Install Helm
        if: steps.deja.outputs.ouverte == '0'
        uses: azure/setup-helm@v4
        with:
          version: v4.0.1

      - name: Compare the defaults with the published releases
        if: steps.deja.outputs.ouverte == '0'
        id: comparer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/propose_bump.py | tee sortie.txt
          python .github/scripts/render_k8s_manifests.py
          # BOTH files, otherwise a chart that is behind on its own would
          # trigger no PR -- that is what left it two versions behind the
          # interface until 10/09/26.
          if git diff --quiet -- docker-compose.yml docker-compose/ .env.example k8s/ helm/apowerb-chart/; then
            echo "change=non" >> "$GITHUB_OUTPUT"
          else
            echo "change=oui" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the PR
        if: steps.deja.outputs.ouverte == '0' && steps.comparer.outputs.change == 'oui'
        env:
          # NOT the GITHUB_TOKEN: the organization's policy forbids GitHub
          # Actions from creating PRs (`createPullRequest` refuses), so this
          # workflow has NEVER opened one -- the six bump PRs up to 18/09/26
          # were all opened by hand. The "green" days were the ones when there
          # was nothing to propose.
          #
          # Lifting the policy would also have allowed workflows to APPROVE
          # PRs, in an organization where apowerb/apowerb requires a review.
          # BUMP_TOKEN is a fine-grained token limited to this repository (Pull
          # requests write, Contents read): it opens the PR, nothing else.
          # It expires -- on expiry, this step fails again.
          #
          # Intended side effect: a PR opened by a personal token triggers
          # the other workflows, which the GITHUB_TOKEN left silent.
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret BUMP_TOKEN is missing: the GITHUB_TOKEN cannot open PRs in this organization."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # One branch PER proposal. The previous fixed name failed as soon as a
          # branch of the same name remained on the remote: on 11/09/26, the push
          # was rejected with `fetch first` because `chore/bump-images` survived
          # PR #44, which was merged. The guard above only looks at OPEN PRs --
          # a closed PR does not prove the branch is free, just as a missing
          # release does not prove a tag is.
          # A unique suffix avoids the collision without resorting to a
          # force-push, which we do not want in an automated workflow.
          branche="chore/bump-images-$(date -u +%Y%m%d)-${{ github.run_number }}"
          git checkout -b "$branche"
          git add docker-compose.yml docker-compose/ .env.example k8s/ helm/apowerb-chart/
          git commit -m "chore(images): pin the latest published versions"  # every installation path
          git push -u origin "$branche"
          gh pr create \
            --base main --head "$branche" \
            --title "chore(images): pin the latest published versions" \
            --body-file bump-body.md
