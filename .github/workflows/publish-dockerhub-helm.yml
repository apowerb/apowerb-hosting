name: Publish Helm chart to OCI registries

on:
  release:
    types: [published]
  # `chart-releaser` crée la release avec le GITHUB_TOKEN du workflow, et
  # GitHub refuse qu'un événement produit par ce jeton en déclenche un autre --
  # la protection anti-boucle. Mesuré le 08/09/26 : la release `apowerb-0.2.0`
  # est bien apparue, et AUCUN run de publication n'a suivi. Sans ce
  # déclencheur manuel, publier demanderait un jeton personnel dans les
  # secrets, ou de republier la release à la main.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à publier (ex. apowerb-0.2.0). Défaut : la ref choisie ci-dessus."
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish-helm-oci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Derive release version
        id: release
        run: |
          # Deux formes de tag arrivent ici, et une seule était traitée :
          #   - "v0.0.3"        : les tags historiques du dépôt ;
          #   - "apowerb-0.2.0" : ceux que chart-releaser pose sur un push main.
          # Avec l'ancien `${TAG_NAME#v}`, le second donnait
          # `helm package --version apowerb-0.2.0` → « Invalid Semantic
          # Version », donc AUCUNE publication n'a jamais abouti par ce chemin.
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG_NAME#apowerb-}"
          VERSION="${VERSION#v}"
          # Un tag qui ne porte pas de version : le chart dit la sienne, plutôt
          # que de casser le paquet.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION="$(helm show chart ./helm/apowerb | awk '/^version:/{print $2}')"
            echo "Tag '$TAG_NAME' sans version : on prend celle de Chart.yaml ($VERSION)."
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Lint chart
        run: helm lint ./helm/apowerb

      - name: Package chart with release version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          helm package ./helm/apowerb --version "$VERSION"

      - name: Login to Docker Hub OCI registry
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Missing Docker Hub credentials. Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN as GitHub Actions secrets."
            exit 1
          fi
          echo "$DOCKERHUB_TOKEN" | helm registry login registry-1.docker.io \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

      - name: Push chart to Docker Hub
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          CHART_TGZ="apowerb-${VERSION}.tgz"
          helm push "$CHART_TGZ" "oci://registry-1.docker.io/apowerb"

      - name: Login to GitHub Container Registry
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          echo "$GHCR_TOKEN" | helm registry login ghcr.io \
            --username "$GHCR_USERNAME" \
            --password-stdin

      - name: Push chart to GitHub Container Registry
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          CHART_TGZ="apowerb-${VERSION}.tgz"
          helm push "$CHART_TGZ" "oci://ghcr.io/${{ github.repository_owner }}/apowerb"
