name: Publish Helm chart to Docker Hub

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-helm-oci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Derive release version
        id: release
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Lint chart
        run: helm lint ./helm/apowerb

      - name: Package chart with release version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          helm package ./helm/apowerb --version "$VERSION"

      - name: Login to Docker Hub OCI registry
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Missing Docker Hub credentials. Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN as GitHub Actions secrets."
            exit 1
          fi
          echo "$DOCKERHUB_TOKEN" | helm registry login registry-1.docker.io \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

      - name: Push chart to Docker Hub
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          CHART_TGZ="apowerb-${VERSION}.tgz"
          helm push "$CHART_TGZ" "oci://registry-1.docker.io/apowerb"
