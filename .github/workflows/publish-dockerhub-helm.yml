name: Publish Helm chart to Docker Hub

# Un seul registre : Docker Hub, celui de l'organisation apowerb, d'où sortent
# déjà les images du produit. GHCR a été retiré le 08/09/26 — le push y
# réussissait mais le paquet naît PRIVÉ dans une organisation GitHub, donc
# `helm pull oci://ghcr.io/apowerb/apowerb` rendait 403 en anonyme. Publier là
# où personne ne peut tirer n'est pas publier.

on:
  release:
    types: [published]
  # `chart-releaser` crée la release avec le GITHUB_TOKEN du workflow, et
  # GitHub refuse qu'un événement produit par ce jeton en déclenche un autre --
  # la protection anti-boucle. Mesuré le 08/09/26 : la release `apowerb-0.2.0`
  # est bien apparue, et AUCUN run de publication n'a suivi. Sans ce
  # déclencheur manuel, publier demanderait un jeton personnel dans les
  # secrets, ou de republier la release à la main.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à publier (ex. apowerb-0.2.0). Défaut : la ref choisie ci-dessus."
        required: false
        type: string

permissions:
  contents: read
  # Signature cosign sans clé : GitHub remet au job un jeton OIDC, que Sigstore
  # échange contre un certificat éphémère au nom de CE workflow. Aucune clé à
  # stocker ni à faire tourner.
  id-token: write

jobs:
  publish-helm-oci:
    runs-on: ubuntu-latest

    steps:
      # Un dispatch tourne sur la ref choisie (main) : sans cette ref, un
      # `tag=apowerb-chart-0.4.14` emballait le contenu de main sous la version
      # du tag (relevé le 23/09/26). Un tag inexistant casse ici au lieu de
      # publier autre chose.
      - name: Checkout the tag to publish
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Setup ORAS
        uses: oras-project/setup-oras@v1

      - name: Setup cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Derive release version
        id: release
        run: |
          # Deux formes de tag arrivent ici, et une seule était traitée :
          #   - "v0.0.3"        : les tags historiques du dépôt ;
          #   - "apowerb-0.2.0" : ceux que chart-releaser pose sur un push main.
          # Avec l'ancien `${TAG_NAME#v}`, le second donnait
          # `helm package --version apowerb-0.2.0` → « Invalid Semantic
          # Version », donc AUCUNE publication n'a jamais abouti par ce chemin.
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          # Le prefixe vient du chart lui-meme : il s'appelait `apowerb`, il
          # s'appelle `apowerb-chart`, et un prefixe ecrit en dur redonnerait
          # ici `chart-0.4.1`.
          CHART_NAME="$(helm show chart ./helm/apowerb-chart | awk '/^name:/{print $2}')"
          VERSION="${TAG_NAME#${CHART_NAME}-}"
          VERSION="${VERSION#apowerb-}"
          VERSION="${VERSION#v}"
          # Un tag qui ne porte pas de version : le chart dit la sienne, plutôt
          # que de casser le paquet.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION="$(helm show chart ./helm/apowerb-chart | awk '/^version:/{print $2}')"
            echo "Tag '$TAG_NAME' sans version : on prend celle de Chart.yaml ($VERSION)."
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Lint chart
        run: helm lint ./helm/apowerb-chart

      - name: Package chart and check its version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # Plus de `--version` : il réécrivait Chart.yaml et maquillait un
          # contenu d'une autre version. Le paquet porte la version du chart
          # extrait, et elle doit être celle du tag.
          CHART_TGZ="$(helm package ./helm/apowerb-chart | sed -n 's/^Successfully packaged chart and saved it to: //p')"
          PACKAGED="$(helm show chart "$CHART_TGZ" | awk '/^version:/{print $2}')"
          if [ "$PACKAGED" != "$VERSION" ]; then
            echo "Le chart extrait est en version '$PACKAGED', le tag demande '$VERSION' : rien n'est publié."
            exit 1
          fi

      - name: Login to Docker Hub OCI registry
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Missing Docker Hub credentials. Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN as GitHub Actions secrets."
            exit 1
          fi
          echo "$DOCKERHUB_TOKEN" | helm registry login registry-1.docker.io \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

      - name: Push chart to Docker Hub
        id: push
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # `helm package` nomme l'archive d'apres Chart.yaml, pas d'apres
          # le repertoire : un nom ecrit en dur casse au premier renommage.
          CHART_NAME="$(helm show chart ./helm/apowerb-chart | awk '/^name:/{print $2}')"
          CHART_TGZ="${CHART_NAME}-${VERSION}.tgz"
          helm push "$CHART_TGZ" "oci://registry-1.docker.io/apowerb" 2>&1 | tee push.log
          # On signe l'empreinte que le push vient de produire, pas le tag : un
          # tag peut être republié entre les deux étapes, une empreinte non.
          DIGEST="$(sed -n 's/^Digest: //p' push.log)"
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Empreinte introuvable dans la sortie de helm push : rien n'est signé."
            exit 1
          fi
          echo "ref=registry-1.docker.io/apowerb/${CHART_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"

      # Artifact Hub affiche « Signed » quand il trouve une signature cosign sur
      # le chart OCI (tag `.sig` ou API referrers), lue à l'indexation d'une
      # NOUVELLE version : une version déjà indexée n'est pas réexaminée.
      # La signature est inscrite dans le registre public Rekor, avec l'identité
      # de ce workflow. Vérification : voir helm/apowerb-chart/README.md.
      - name: Sign chart with cosign (keyless)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          CHART_REF: ${{ steps.push.outputs.ref }}
        run: |
          echo "$DOCKERHUB_TOKEN" | cosign login registry-1.docker.io \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin
          cosign sign --yes "$CHART_REF"

      - name: Push Artifact Hub repository metadata
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Identifiants passés au push lui-même, sans `oras login` : le 29/09/26
          # (run 36572858199, ORAS 1.3.0) le login répondait « Login Succeeded »
          # puis le push recevait 401 sur auth.docker.io, alors que `helm push`
          # venait d'écrire dans ce même dépôt avec les mêmes secrets. Le push ne
          # dépend plus du magasin d'identifiants rempli par le login.
          echo "$DOCKERHUB_TOKEN" | oras push registry-1.docker.io/apowerb/apowerb-chart:artifacthub.io \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

