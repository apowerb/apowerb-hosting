name: Publish Helm chart to Docker Hub

# A single registry: Docker Hub, the apowerb organization's, where the
# product's images already come from. GHCR was removed on 08/09/26 — the push
# there succeeded but the package is born PRIVATE in a GitHub organization, so
# `helm pull oci://ghcr.io/apowerb/apowerb` returned 403 anonymously.
# Publishing where nobody can pull is not publishing.

on:
  release:
    types: [published]
  # `chart-releaser` creates the release with the workflow's GITHUB_TOKEN, and
  # GitHub refuses to let an event produced by that token trigger another --
  # the anti-loop protection. Measured on 08/09/26: the `apowerb-0.2.0` release
  # did appear, and NO publish run followed. Without this manual trigger,
  # publishing would require a personal token in the secrets, or republishing
  # the release by hand.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. apowerb-0.2.0). Default: the ref chosen above."
        required: false
        type: string

permissions:
  contents: read
  # Keyless cosign signing: GitHub hands the job an OIDC token, which Sigstore
  # exchanges for a short-lived certificate issued to THIS workflow. No key to
  # store or rotate.
  id-token: write

jobs:
  publish-helm-oci:
    runs-on: ubuntu-latest

    steps:
      # A dispatch runs on the chosen ref (main): without this ref, a
      # `tag=apowerb-chart-0.4.14` packaged main's content under the tag's
      # version (observed on 23/09/26). A nonexistent tag breaks here instead
      # of publishing something else.
      - name: Checkout the tag to publish
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Setup ORAS
        uses: oras-project/setup-oras@v1

      - name: Setup cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Derive release version
        id: release
        run: |
          # Two tag forms arrive here, and only one was handled:
          #   - "v0.0.3"        : the repository's historical tags;
          #   - "apowerb-0.2.0" : those chart-releaser sets on a push to main.
          # With the old `${TAG_NAME#v}`, the second gave
          # `helm package --version apowerb-0.2.0` → "Invalid Semantic
          # Version", so NO publication ever succeeded through this path.
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          # The prefix comes from the chart itself: it was called `apowerb`, it is
          # now called `apowerb-chart`, and a hard-coded prefix would give
          # `chart-0.4.1` here.
          CHART_NAME="$(helm show chart ./helm/apowerb-chart | awk '/^name:/{print $2}')"
          VERSION="${TAG_NAME#${CHART_NAME}-}"
          VERSION="${VERSION#apowerb-}"
          VERSION="${VERSION#v}"
          # A tag that carries no version: the chart states its own, rather than
          # breaking the package.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION="$(helm show chart ./helm/apowerb-chart | awk '/^version:/{print $2}')"
            echo "Tag '$TAG_NAME' has no version: using the one from Chart.yaml ($VERSION)."
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Lint chart
        run: helm lint ./helm/apowerb-chart

      - name: Package chart and check its version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # No more `--version`: it rewrote Chart.yaml and disguised content from
          # another version. The package carries the version of the checked-out
          # chart, and it must be the tag's.
          CHART_TGZ="$(helm package ./helm/apowerb-chart | sed -n 's/^Successfully packaged chart and saved it to: //p')"
          PACKAGED="$(helm show chart "$CHART_TGZ" | awk '/^version:/{print $2}')"
          if [ "$PACKAGED" != "$VERSION" ]; then
            echo "The checked-out chart is at version '$PACKAGED', the tag asks for '$VERSION': nothing is published."
            exit 1
          fi

      - name: Login to Docker Hub OCI registry
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Missing Docker Hub credentials. Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN as GitHub Actions secrets."
            exit 1
          fi
          echo "$DOCKERHUB_TOKEN" | helm registry login registry-1.docker.io \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

      - name: Push chart to Docker Hub
        id: push
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # `helm package` names the archive after Chart.yaml, not after the
          # directory: a hard-coded name breaks on the first rename.
          CHART_NAME="$(helm show chart ./helm/apowerb-chart | awk '/^name:/{print $2}')"
          CHART_TGZ="${CHART_NAME}-${VERSION}.tgz"
          helm push "$CHART_TGZ" "oci://registry-1.docker.io/apowerb" 2>&1 | tee push.log
          # Sign the digest this push just produced, not the tag: a tag can be
          # republished between the two steps, a digest cannot.
          DIGEST="$(sed -n 's/^Digest: //p' push.log)"
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "No digest in the helm push output: nothing is signed."
            exit 1
          fi
          echo "ref=registry-1.docker.io/apowerb/${CHART_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"

      # Artifact Hub shows "Signed" when it finds a cosign signature on the OCI
      # chart (`.sig` tag or referrers API), read when a NEW version is
      # indexed: a version already indexed is not re-examined.
      # The signature is recorded in the public Rekor log, with this
      # workflow's identity. Verification: see helm/apowerb-chart/README.md.
      - name: Sign chart with cosign (keyless)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          CHART_REF: ${{ steps.push.outputs.ref }}
        run: |
          echo "$DOCKERHUB_TOKEN" | cosign login registry-1.docker.io \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin
          cosign sign --yes "$CHART_REF"

      - name: Push Artifact Hub repository metadata
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Credentials passed to the push itself, without `oras login`: on 29/09/26
          # (run 36572858199, ORAS 1.3.0) the login answered "Login Succeeded"
          # and then the push got 401 on auth.docker.io, even though `helm push`
          # had just written to that same repository with the same secrets. The
          # push no longer depends on the credential store filled in by the login.
          echo "$DOCKERHUB_TOKEN" | oras push registry-1.docker.io/apowerb/apowerb-chart:artifacthub.io \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

