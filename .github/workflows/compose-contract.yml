name: Compose contract

# Compose passes a container only what the service DECLARES. A value entered
# in the platform's panel, a variable exported on the host: everything else
# stops at the container wall, silently, and the application starts looking
# configured.
#
# The three outages of 08/09/2026 are that sentence:
#   * hosting#23 — ORCHESTRATOR not declared: the backend queried a Mage that
#     did not exist while a healthy th2etl was running next to it;
#   * hosting#24 — 19 integration variables not declared: the Azure
#     credentials were set in the panel and Outlook still refused;
#   * hosting#25 — `OUTLOOK_MAIL_REDIRECT_URI: ${OUTLOOK_MAIL_REDIRECT_URI:-}`:
#     a variable declared EMPTY is not an absent variable. pydantic counts it
#     as provided, it overrides the value the core would have derived,
#     and Microsoft received "" — AADSTS90102 in production.
#
# Each one is a comparison between two lists that nobody was making. This
# guard makes it, against the IMAGE this file pins: `tests/probe_core.py`
# runs inside it, so what is measured is the deployed artifact and not a
# copy of the sources alongside.
#
# It FAILS, it does not warn. This repository deploys `main` on its own: a
# warning on a PR would arrive after what it describes is already live.
# Allow ~1 min for the image pull the first time.

on:
  pull_request:
    paths:
      - docker-compose.yml
      - tests/**
      - .github/workflows/compose-contract.yml
  push:
    branches: [main]
    paths:
      - docker-compose.yml
      - tests/**
      - .github/workflows/compose-contract.yml
  # The core moves without this repository moving: a new setting in 0.2.13
  # will trigger neither of the two events above. Run it by hand when
  # APOWERB_BACKEND_TAG is bumped, and available for a one-off check.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Does the compose file pass what the core can read?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # pytest and PyYAML, nothing else: the probe runs in the image, so
      # none of the core's 51 dependencies needs to be installed here.
      - name: Test dependencies
        run: pip install -r tests/requirements.txt

      # APOWERB_CORE_SRC is never set here: what is measured must be the
      # pinned image, never a working copy.
      - name: pytest
        working-directory: tests
        run: python -m pytest
