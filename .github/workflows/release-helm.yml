name: Release Helm Charts

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: helm
          # Without this, ANY commit that does not bump `Chart.yaml` makes this
          # workflow fail:
          #   error creating GitHub release apowerb-0.4.0: 422 already_exists
          # that is, most commits. A permanent red ends up being ignored -- and
          # that is exactly what hid the real failure for weeks, the missing
          # `origin/gh-pages`. The workflow must be green when there is nothing
          # to publish.
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
