name: Release Helm Charts

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: helm
          # Sans ceci, TOUT commit qui ne bumpe pas `Chart.yaml` fait échouer
          # ce workflow :
          #   error creating GitHub release apowerb-0.4.0: 422 already_exists
          # c'est-à-dire la plupart des commits. Un rouge permanent finit par
          # être ignoré -- et c'est exactement ce qui a caché pendant des
          # semaines la vraie panne, `origin/gh-pages` absente. Le workflow
          # doit être vert quand il n'y a rien à publier.
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
