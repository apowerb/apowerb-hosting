# Redirects plain-text traffic to HTTPS.
#
# Without it, Traefik serves the same page on port 80: `ingress.tlsEnabled`
# adds the certificate, it does not close the plain-text entry point. Measured
# on 09/09/26 on k8s.apowerb.com — `http://` answered 200, not 308, and a
# visitor who types the address without `https://` enters their credentials
# in clear text.
#
# The name to reference from the Ingress carries the namespace and the provider:
#   traefik.ingress.kubernetes.io/router.middlewares: apowerb-redirect-https@kubernetescrd
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: apowerb
spec:
  redirectScheme:
    scheme: https
    permanent: true
