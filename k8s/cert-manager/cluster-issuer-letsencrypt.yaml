# Let's Encrypt issuer for cert-manager.
#
# An installed cert-manager issues no certificate: it waits for an issuer.
# This one is *cluster-scoped* (usable from any namespace), hence
# `ClusterIssuer` and not `Issuer` — the application chart does not create it:
# a cluster-wide issuer does not belong to a release.
#
# The HTTP-01 challenge goes through the Ingress: cert-manager creates a
# temporary Ingress on `/.well-known/acme-challenge/…`, which Let's Encrypt
# comes to read. The public name must therefore ALREADY point to the ingress
# controller's IP, and port 80 must be reachable — otherwise the command
# succeeds and the certificate stays at `False`, which shows up in
# `kubectl describe certificate`.
#
#   kubectl apply -f cluster-issuer-letsencrypt.yaml
#   kubectl get clusterissuer letsencrypt-prod -o wide     # expect READY=True
#
# The chart's Ingress hooks into it through an annotation:
#   --set ingress.tlsEnabled=true \
#   --set ingress.annotations."cert-manager\.io/cluster-issuer"=letsencrypt-prod
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # Let's Encrypt sends expiry notices here: use a mailbox that is actually read.
    email: david.gnaglo@thaink2.com
    privateKeySecretRef:
      # Created by cert-manager: the ACME account key, not a certificate.
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            # `ingressClassName`, not `class`: the latter goes through the old
            # `kubernetes.io/ingress.class` annotation and is no longer
            # recommended except for ingress-gce. With `class`, the challenge's
            # temporary Ingress is born without a recognized class, Traefik does
            # not route it, and the certificate stays `Ready: False` without
            # anything having failed loudly.
            ingressClassName: traefik
---
# The same, against Let's Encrypt's staging environment. Its certificates are
# not trusted by browsers, but its quotas are generous: it is the one used to
# test the chain (DNS, port 80, ingress) without consuming production's
# 5 failures/hour, which then block for a week.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: david.gnaglo@thaink2.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            # `ingressClassName`, not `class`: the latter goes through the old
            # `kubernetes.io/ingress.class` annotation and is no longer
            # recommended except for ingress-gce. With `class`, the challenge's
            # temporary Ingress is born without a recognized class, Traefik does
            # not route it, and the certificate stays `Ready: False` without
            # anything having failed loudly.
            ingressClassName: traefik
