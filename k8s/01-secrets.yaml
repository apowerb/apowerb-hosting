apiVersion: v1
kind: Secret
metadata:
  name: apowerb-secrets
  namespace: apowerb
type: Opaque
stringData:
  DB_NAME: th2agent
  DB_USER: th2agent
  # Empty on purpose, like ENCRYPT_KEY below: a value shipped in a public
  # repository is no longer a secret. Set it before applying this
  # manifest -- openssl rand -hex 24
  DB_PASSWORD: ""
  ENCRYPT_KEY: ""
  TEST_TOKEN: ""
