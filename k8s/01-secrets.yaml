apiVersion: v1
kind: Secret
metadata:
  name: apowerb-secrets
  namespace: apowerb
type: Opaque
stringData:
  DB_NAME: th2agent
  DB_USER: th2agent
  # Vide à dessein, comme ENCRYPT_KEY ci-dessous : une valeur livrée dans un
  # dépôt public n'est plus un secret. Posez-la avant d'appliquer ce
  # manifeste -- openssl rand -hex 24
  DB_PASSWORD: ""
  ENCRYPT_KEY: ""
  TEST_TOKEN: ""
